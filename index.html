<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#141821;--bg-2:#191e29;--panel:#202634;--panel-2:#171c27;--panel-3:#2a3345;
  --border:#2b3342;--border-strong:#3d4757;--text:#e6e0d0;--text-mute:#97a0b5;--text-dim:#5e6577;
  --gold:#d4a145;--gold-light:#e6b558;--rust:#cb5745;--jade:#5da478;--warn:#dca750;
  --ink:var(--gold);--ok:var(--jade);--ko:var(--rust);--wa:var(--warn);
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --header-height:72px;
  --sidebar-top:calc(env(safe-area-inset-top,0px) + var(--header-height));
  --window-left:220px;
  --window-bottom:0px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
body{margin:0;min-height:100vh;color:var(--text);font:15.5px/1.6 var(--font-mono);
  background:radial-gradient(ellipse at 50% 0%,#1a202e 0%,var(--bg) 70%);
  display:grid;grid-template-columns:220px minmax(0,1fr) 286px;grid-template-rows:auto 1fr;align-items:start}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:11;
  background:var(--bg-2);border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(0,0,0,.45);
  padding:14px 28px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.brand{display:flex;align-items:center;gap:11px;margin-right:18px}
.mark{width:32px;height:32px;background:var(--gold);color:#1a1d26;border-radius:4px;
  display:grid;place-items:center;font:700 13px var(--font-mono);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1px 0 rgba(0,0,0,.35)}
.logo{font:700 19px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.chip{font:500 15px var(--font-mono);background:var(--panel-2);border:1px solid var(--border);
  border-radius:4px;padding:6px 12px;color:var(--text-mute);display:inline-flex;align-items:center;gap:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);transition:border-color .15s}
.chip:hover{border-color:var(--border-strong)}
.chip strong{color:var(--text);font:600 15px var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chip strong.ko{color:var(--rust)}
.sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end;max-width:100%}
.time-actions{display:flex;gap:6px;align-items:center;max-width:100%}
.date-chip{white-space:nowrap}
.date-chip strong{font-size:21px;line-height:1.2}
.success-button{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
button{font:600 13.5px var(--font-mono);border:1px solid var(--border-strong);
  background:var(--panel);color:var(--text);padding:8px 15px;border-radius:4px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 rgba(0,0,0,.4);
  transition:background .12s,border-color .12s,transform .08s,box-shadow .12s}
button:not(:disabled):hover{background:var(--panel-3);border-color:var(--gold)}
button:not(:disabled):active{box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.on,button.go{background:var(--gold);color:#1a1d26;border-color:#a67c2c;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 #7a5a1f}
button.on:not(:disabled):hover,button.go:not(:disabled):hover{background:var(--gold-light);border-color:#a67c2c}
button.no{color:var(--rust)}
button.no:not(:disabled):hover{border-color:var(--rust);background:var(--panel-3)}
button.rs{background:transparent;color:var(--gold);border-color:var(--gold);box-shadow:none}
button.rs:not(:disabled):hover{background:rgba(212,161,69,.1);border-color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
nav{grid-column:1;position:sticky;top:var(--sidebar-top);max-height:calc(100dvh - var(--sidebar-top));
  display:flex;flex-direction:column;gap:4px;padding:22px 12px 22px 16px;overflow:auto}
nav button{display:flex;align-items:center;gap:12px;text-align:left;font:500 17px var(--font-mono);
  color:var(--text-mute);padding:11px 14px;border-radius:4px;border:1px solid transparent;background:transparent;box-shadow:none}
nav button:not(:disabled):hover{background:var(--panel-2);color:var(--text);border-color:transparent;transform:none;box-shadow:none}
nav button:not(:disabled):active{transform:none;box-shadow:none}
nav button.on{background:var(--panel);color:var(--text);border-color:var(--border);box-shadow:inset 3px 0 0 var(--gold)}
.ic{font-size:22px;line-height:1;width:27px;flex:none;text-align:center}
main{grid-column:2;grid-row:2;min-width:0;width:100%;max-width:1020px;margin:0 auto;padding:30px clamp(18px,3vw,42px) 100px}
#marketRail{grid-column:3;grid-row:2;position:sticky;top:var(--sidebar-top);
  padding:24px 16px 24px 0;max-height:calc(100dvh - var(--sidebar-top));overflow:auto;min-width:0}
.rail-title{margin:0 0 12px;padding-left:10px;font-size:22px}
.market-list{display:grid;gap:10px}
.market-tile{overflow:hidden;border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:5px;
  padding:12px 14px;background:var(--panel-2)}
.market-tile button{display:block;width:100%;text-align:left;padding:0;border:0;background:none;box-shadow:none;
  color:var(--gold-light);font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.market-tile button:not(:disabled):hover{background:none;text-decoration:underline}
.market-tile p{margin:4px 0 0;color:var(--text-mute);font-size:14px;overflow-wrap:anywhere}
.market-tile p strong.ok,.market-tile p strong.ko{font-size:16px}
.market-tile p.wa{color:var(--warn)}
.run-status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-mute);white-space:nowrap}
.run-status.running{color:var(--jade)}
#timeControl{white-space:nowrap}
.run-clock{display:inline-block;position:relative;width:35px;height:35px;border:2px solid currentColor;border-radius:50%}
.run-clock::before,.run-clock::after{content:"";position:absolute;left:calc(50% - 1px);bottom:50%;width:2px;
  height:13px;border-radius:2px;background:currentColor;transform-origin:50% 100%;animation:clock-spin 1.2s linear infinite paused}
.run-clock::after{height:9px;transform:rotate(55deg);animation-duration:14.4s}
.running .run-clock::before,.running .run-clock::after{animation-play-state:running}
@keyframes clock-spin{to{transform:rotate(360deg)}}
.field-error{color:#ff8f87;margin:8px 0 0;font-size:13px;font-weight:600}
.field-error:empty{display:none}
@media(max-width:1179px) and (min-width:860px){
  body{grid-template-columns:202px minmax(0,1fr);grid-template-rows:auto auto 1fr;--window-left:202px}
  nav{grid-row:2 / span 2}
  main{grid-row:3;padding-top:16px}
  #marketRail{grid-column:2;grid-row:2;position:static;max-height:none;padding:18px 26px 0}
  .market-list{display:flex;overflow:auto;padding-bottom:4px}
  .market-tile{flex:0 0 230px}
}
.c{background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:26px 30px;margin-bottom:26px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 1px 0 rgba(0,0,0,.35)}
h3{font:700 22px/1.3 var(--font-mono);color:var(--text);
  margin:0 0 18px;padding:0 0 0 13px;border-left:3px solid var(--gold);display:block}
h3.ko{border-left-color:var(--rust);color:var(--rust)}
h4{font:600 12px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--text-mute);
  margin:20px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--border)}
p{margin:7px 0;color:var(--text)}
.mu{color:var(--text-mute)}
.ok{color:var(--jade)}
.ko{color:var(--rust)}
.wa{color:var(--warn)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.field-caption{display:inline-block;align-self:flex-start;width:fit-content;max-width:100%}
#newProject label.feat-check,#engTechs label.feat-check{flex-direction:row;align-items:flex-start}
#newProject label.feat-check input,#engTechs label.feat-check input{margin-top:2px}
.license-section{margin:12px 0 20px;padding:12px 15px 15px;border:1px solid var(--border);border-radius:6px;background:var(--panel-2)}
.license-section legend{padding:0 7px;color:var(--text);font-weight:600;font-size:14px}
.license-section p{margin:0 0 10px;font-size:13px}
.license-section + h4{margin-top:0}
#newProject{min-width:0}
.license-section{min-width:0}
.engine-tech-list{display:flex;flex-wrap:wrap;gap:4px 9px;margin-top:6px}
.engine-tech-list .field-caption{font-size:12px;color:var(--gold-light)}
label{display:flex;flex-direction:column;gap:7px;color:var(--text-mute);font:600 11.5px var(--font-mono);
  letter-spacing:.08em;text-transform:uppercase}
input,select{font:500 14.5px var(--font-mono);padding:10px 12px;border:1px solid var(--border-strong);
  border-radius:4px;background:var(--panel-2);color:var(--text);width:100%;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25);transition:border-color .12s,box-shadow .12s}
input:focus,select:focus{border-color:var(--gold);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(212,161,69,.15);outline:none}
input[type=range]{padding:0;height:24px;background:transparent;box-shadow:none;accent-color:var(--gold);cursor:pointer}
.bar{height:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:2px;
  overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);position:relative}
.bar i{display:block;height:100%;background:var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  transition:width .3s ease-out}
.row{display:grid;grid-template-columns:150px 1fr 130px;gap:14px;align-items:center;
  margin:12px 0;font:500 14.5px var(--font-mono)}
.row.progress{grid-template-columns:minmax(110px,150px) minmax(48px,1fr) minmax(145px,max-content)}
.row.progress .points{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;justify-content:flex-end}
.row.progress .points small{color:var(--text-mute)}
.daily-fin th,.daily-fin td{padding:9px clamp(4px,1.4vw,13px)}
.daily-fin td:first-child{white-space:normal}
.daily-fin .amount{font-variant-numeric:tabular-nums;text-decoration:underline dotted;text-underline-offset:4px}
.daily-fin .amount:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row > span:last-child{font-family:var(--font-mono);font-size:13px;letter-spacing:-.02em}
.tw{overflow-x:auto;margin:0 -8px}
table{border-collapse:separate;border-spacing:0;width:100%;font:500 14px var(--font-mono);font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:11px 13px;white-space:nowrap;border-bottom:1px solid var(--border)}
th{font:600 11.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-mute);background:var(--panel-2);border-bottom:1px solid var(--border-strong)}
table tr:last-child td{border-bottom:0}
table tr:hover td{background:rgba(255,255,255,.02)}
.lg{max-height:300px;overflow:auto;font:400 13.5px var(--font-mono);color:var(--text-mute);padding-right:8px}
.lg div{padding:9px 0;border-bottom:1px solid var(--border)}
.lg div:last-child{border-bottom:0}
.bt{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;align-items:center}
.fl{position:fixed;z-index:30;pointer-events:none;font:600 18px var(--font-mono);
  text-shadow:0 2px 0 var(--bg);animation:fl 1.3s ease-out forwards}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}
#ts{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));
  z-index:40;pointer-events:none;display:flex;flex-direction:column;gap:9px;max-width:min(360px,calc(100vw - 44px))}
.t{background:var(--panel);color:var(--text);border:1px solid var(--border-strong);border-left:3px solid var(--border);
  border-radius:4px;padding:12px 15px;font:500 13.5px var(--font-mono);box-shadow:0 8px 24px -10px rgba(0,0,0,.7);
  animation:ti .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes ti{from{transform:translateX(30px);opacity:0}}
#md{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.78);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:mdin .2s ease-out}
@keyframes mdin{from{opacity:0}to{opacity:1}}
.mb{background:var(--panel);border:1px solid var(--border-strong);border-radius:8px;
  padding:32px;max-width:520px;width:100%;text-align:center;max-height:90vh;overflow-y:auto;
  box-shadow:0 24px 60px -20px #000,inset 0 1px 0 rgba(255,255,255,.06)}
.mb.wide{max-width:640px;text-align:left}
.big{font:700 96px/1 var(--font-mono);color:var(--gold);margin:14px 0;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 4px 0 rgba(0,0,0,.35)}
#cf{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:6px}
.feat-check{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:4px;cursor:pointer;font:500 13px var(--font-mono);
  color:var(--text-mute);letter-spacing:normal;text-transform:none;transition:border-color .15s,background .15s,transform .1s}
.feat-check:hover{border-color:var(--border-strong);background:rgba(255,255,255,.02)}
.feat-check input{width:16px;height:16px;accent-color:var(--gold);cursor:pointer;margin:0;padding:0;flex-shrink:0}
.feat-check input:checked + span{color:var(--gold)}
.feat-check small{display:block;font-size:11px;color:var(--text-dim);margin-top:2px}
.chart{overflow-x:auto;margin:10px 0}
[data-tip]{cursor:help}
button[data-tip]:not(:disabled),[data-tip] input,[data-tip] select{cursor:pointer}
#hoverTip{position:fixed;z-index:1000;pointer-events:none;white-space:pre-line;overflow-wrap:anywhere;
  width:max-content;max-width:min(320px,calc(100vw - 24px));padding:9px 12px;color:var(--text);
  background:var(--panel-2);border:1px solid var(--border-strong);border-radius:6px;font:500 12.5px/1.52 var(--font-mono);
  box-shadow:0 6px 18px rgba(0,0,0,.65)}
.rail-chart{width:100%;height:42px;display:block;margin:6px 0}
.market-tile p.ko{color:#ff998f}
.market-tile .stock-link{color:#ff998f}
.stock-link{display:inline-flex}

.eng-slider-wrap{padding:8px 0 16px}
.slider-value{display:inline-block;font-family:var(--font-mono);color:var(--gold);font-weight:600;font-size:15px}
.warn-box{padding:10px 13px;margin-top:10px;border:1px solid transparent;border-radius:4px;font:500 13.5px var(--font-mono);line-height:1.5}
.warn-box.wa{border-color:var(--warn);background:rgba(220,167,80,.07);color:var(--warn)}
.warn-box.mu{border-color:var(--border);color:var(--text-mute);background:transparent}
.warn-box:empty{display:none}
.team-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--border);
  border-radius:6px;padding:12px 16px;margin-bottom:20px;font-size:13.5px}
.team-bar button{font-size:12.5px;padding:6px 12px}
.trophy{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;margin:8px 0}
.trophy.locked{opacity:.4}
.trophy-icon{font-size:28px;width:40px;text-align:center}
.trophy-title{font-weight:600;color:var(--text)}
.trophy-desc{font-size:12px;color:var(--text-mute)}
.genre-row{display:grid;grid-template-columns:140px 1fr 70px 100px;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.genre-row > span:first-child{font-weight:500;color:var(--text)}
.genre-value{font-family:var(--font-mono);font-weight:600;text-align:right}
.genre-boost{font-size:12px}
@media(max-width:859px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr;--window-left:0px;--window-bottom:70px}
  nav{position:fixed;grid-column:auto;left:0;right:0;top:auto;bottom:0;z-index:20;max-height:none;
    flex-direction:row;gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));
    background:var(--bg-2);border-top:1px solid var(--border);overflow-x:auto}
  nav button{flex:0 0 auto;flex-direction:column;gap:3px;text-align:center;font-size:12px;padding:8px 8px;border-radius:0;min-width:72px}
  nav button.on{box-shadow:inset 0 -3px 0 var(--gold);background:transparent;border-color:transparent}
  .ic{font-size:20px}
  main{grid-column:1;grid-row:3;max-width:none;padding:16px 18px 130px}
  #marketRail{grid-column:1;grid-row:2;position:static;max-height:none;padding:14px 18px 0}
  .market-list{display:flex;overflow:auto;padding-bottom:4px}
  .market-tile{flex:0 0 216px}
  #ts{bottom:calc(90px + env(safe-area-inset-bottom,0px));right:14px}
  .row{grid-template-columns:110px 1fr 80px;gap:10px;font-size:13.5px}
  .logo{font-size:16px}
  .mark{width:28px;height:28px;font-size:11px}
  header{padding:11px 16px}
  .c{padding:18px 20px;border-radius:5px;margin-bottom:20px}
  h3{font-size:19px;padding-left:11px}
  .feat-grid{grid-template-columns:1fr}
  .genre-row{grid-template-columns:100px 1fr 60px;gap:8px}
  .genre-row .genre-boost{display:none}
}
@media(max-width:520px){
  header > .reputation-chip{display:none}
  .row.progress{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .row.progress .bar{grid-area:2 / 1 / 3 / 3}
  .daily-fin table{font-size:12px}
}
@media(max-width:640px){
  .time-actions button{flex:none;padding:6px 7px;font-size:12px}
  .time-actions .date-chip{min-width:0;padding:6px 7px;white-space:normal}
  .date-chip strong{font-size:16px}
  .date-chip > span,.success-button span+span{display:none}
}
@media(max-width:360px){
  .time-actions{gap:4px}
  .time-actions button{padding-inline:5px;font-size:11px}
  .time-actions .date-chip{padding-inline:5px}
}
.market-hype{display:grid;gap:3px;font-size:12px;color:var(--text-mute);margin:7px 0}
.market-hype .bar{height:7px}
.market-hype strong{color:var(--gold-light)}
.tooltip-rp{color:var(--text)}
.tooltip-rule{margin-top:6px;color:var(--text-mute)}
.tooltip-effects{margin:8px 0 0;padding:7px 0 0;border-top:1px solid var(--border);list-style:none;font-size:12px;font-weight:600}
.tooltip-effects .ok{color:#84ce9d}.tooltip-effects .ko{color:#ff998f}
.lang-flag{display:inline-block;width:28px;height:18px;vertical-align:middle;border:1px solid var(--border-strong);border-radius:2px}
.window-mode{order:-1;border-bottom:1px solid var(--border);display:flex;flex-direction:row;align-items:center;gap:7px;padding:9px 12px;cursor:pointer;
  color:var(--text-mute);text-transform:none;letter-spacing:normal;font-size:12px;white-space:nowrap}
.window-mode input{width:auto;margin:0;accent-color:var(--gold)}
#windowSpace{position:fixed;inset:var(--sidebar-top) 0 var(--window-bottom) var(--window-left);z-index:8;pointer-events:none}
.desktop-window{position:absolute;display:flex;flex-direction:column;border:1px solid var(--border-strong);border-radius:7px;
  box-shadow:0 14px 35px #0009;background:var(--bg);pointer-events:auto;overflow:hidden}
.desktop-window:focus-within{border-color:var(--gold)}
.window-title{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-3);
  padding:5px 8px 5px 13px;font-size:13px;font-weight:600;cursor:move;touch-action:none}
.window-title button{padding:3px 8px}
.window-content,#windowSpace #mn{flex:1 1 auto;min-height:0;min-width:0;width:100%;max-width:none;margin:0;padding:14px 14px 20px;overflow:auto}
.window-content .c,#windowSpace #mn .c{padding:16px;margin-bottom:14px}
.window-resize{position:absolute;right:1px;bottom:1px;width:22px;height:22px;padding:0;cursor:nwse-resize;touch-action:none;
  background:var(--panel-2);color:var(--gold)}
[hidden]{display:none!important}

function getGenreDemand(genre, year) {
  var curve = GENRE_CURVES[genre];
  if (!curve) return 1;
  var years = Object.keys(curve).map(Number);
  var next = years.findIndex(anchor => anchor > year);
  var demand;
  if (next < 0) demand = curve[years.at(-1)];
  else if (next === 0) demand = curve[years[0]];
  else {
    var a = years[next-1], b = years[next];
    demand = curve[a] + (curve[b]-curve[a]) * (year-a) / (b-a);
  }
  return 1 + (demand-1)*1.24;
}

}

  var polish = polishProgress(p);

function projectDailyCost(team, daysInMonth = 30.4) {
  var activeTeams = g.teams.filter(candidate => candidate.proj || candidate === team).length;
  return (teamBurn(team) + OFF[g.off].rent / activeTeams) / daysInMonth;
}

function developProject(team, p) {
  var staff = g.staff.filter(s => s.teamId === team.id);
  var efficiency = coordination(staff.length)*engineWorkMultiplier(getEngine(p.engineId));
  var focus = PRIORITIES[p.priority] || PRIORITIES.balanced;
  var qaActive = coverage(p,'prog') >= .5;
  var coreFinished = coreDone(p);
  var qaEffort = 0;
  var extraBugs = 0;

  for (var member of staff) {
    var rate = workRate(member, team) * efficiency;
    var role = member.role;
    var testShare = role === 'qa' ? 1
      : !qaActive ? 0 : (coverage(p,role) >= 1 ? focus.finished : focus.test);
    var testRate = rate * testShare;
    qaEffort += testRate * (role === 'qa' ? 1.32 : .90);
    if (role !== 'qa') {
      var available = rate * (1 - testShare);
      var completed = Math.min(available, Math.max(0, p.need[role] - p.done[role]));
      p.done[role] += completed;
      p.craft[role] += completed * member.skill;
      if (coreFinished) p.polish += available * clamp(.45,1.35,member.skill / SC[p.sc].skill);
      if (role === 'prog') {
        extraBugs += completed * (.115 - .06 * member.skill/10000) * focus.bug
          * (team.crunch ? 1.38 : 1) * (1 - .1*(g.eq.srv||0));
      }
    }
    member.skill = Math.min(9999, member.skill + (member.skill < 2000 ? .7 : member.skill < 4500 ? .3 : .1));
    member.morale = clamp(0, 100, member.morale + (team.crunch
      ? -.65*(1-.15*(g.eq.rest||0)) : .10 + .1*(g.eq.rest||0)));
  }
  p.polish = Math.min(p.polish,polishTarget(p));
  p.done.qa = Math.min(p.need.qa, p.done.qa + qaEffort);
  p.bugs = Math.max(0, p.bugs + extraBugs - qaEffort * .28);
}

function getEngine(id) {
  var own = (g.engines||[]).find(e => e.id === id);
  if (own) return own;
  var st = STOCK_ENGINES.find(e => e.id === id);
  if (st && (g.stockEngines||[]).indexOf(id) >= 0) return st;
  return null;
}

function runMonthlyEvent() {
  var era = getEra();
  var eligible = EVENTS.filter(function(ev) {
    if (ev.era && ev.era.split(',').indexOf(era) < 0) return false;
    try { return ev.cond(); } catch(e) { return false; }
  });
  if (!eligible.length) return;
  var ev = pick(eligible);
  var msg = ev.apply();
  if (msg) L(msg, ev.bad ? 'ko' : 'ok');
  if (!ev.bad) snd(500, .15, 'sine', .03);
}

function tick() {
  if (g.over || pressedPointer !== null) return;
  g.day++;
  delete g.dailyFin[g.day - DAILY_FIN_DAYS];
  var d = dt();


  var daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  for (var team of g.teams) {
    var p = team.proj;
    if (!p) continue;
    var allocation = projectDailyCost(team, daysInMonth);
    p.spent += allocation;
    p.campaignHype = Math.max(0,(p.campaignHype || 0)*.996 - .035);
    p.hype = Math.max(p.pubFloor || 0, p.hype - (p.campaignHype > 1 ? .16 : .38));
    var base = p.dlcBaseId === undefined ? null : g.rel.find(r => r.id === p.dlcBaseId);
    if (base) trackGameFinance(base, 'cost', allocation);
    developProject(team, p);

    if (!p.polishing && coreDone(p) && coverage(p,'qa') >= .9999) {
      p.polishing = true;
      p.launchDecision = 'pending';
      L('Le développement de « ' + p.name + ' » est terminé.', 'ok');
    }
  }

  for (var sj = 0; sj < g.staff.length; sj++) {
    var s2 = g.staff[sj];
    var team2 = g.teams.find(t => t.id === s2.teamId);
    if (!team2 || !team2.proj) s2.morale = Math.min(80, s2.morale + .3);
  }
  for (var sk = g.staff.length - 1; sk >= 0; sk--) {
    if (g.staff[sk].morale < 10 && Math.random() < .02) {
      var s3 = g.staff[sk];
      g.staff.splice(sk, 1);
      L(s3.name + ' démissionne (épuisement).');
    }
  }


  var dv = 0;
  var week = Math.floor(g.day/7);
  var dayOfWeek = g.day%7;
  var weeklyCapacity = physCapWeek();
  var capacity = Math.floor((dayOfWeek+1)*weeklyCapacity/7)-Math.floor(dayOfWeek*weeklyCapacity/7);
  var studioStock = (g.stockWeeks ||= {})[week] ||= {filled:0,lost:0,value:0,capacity:0};
  studioStock.capacity += capacity;
  delete g.stockWeeks[week-26];
  var physical = {remaining:capacity, totals:studioStock};
  var service = serviceSnapshot();
  for (var game of g.rel) {
    var before = game.u;
    dv += sellCopies(game,physical) + sellAddons(game);
    dv += runLiveGame(game, game.u-before, service);
    organicCatalogEvents(game);
    var age = g.day-game.day;
    if (game.support && age > 0 && age <= 180 && age % 30 === 0) {
      spend(game.support,'Support de « ' + game.name + ' »');
      trackGameFinance(game,'cost',game.support);
    }
  }

  if (dv > 20) {
    var e = $('#cash');
    if (e) { var b = e.getBoundingClientRect(); flt('+'+fmt(dv), 'ok', b.left, b.bottom); }
  }
  if (d.getDate() === 1) monthly();
  if (d.getMonth() === 0 && d.getDate() === 1) yearly();
  g.neg = g.cash < 0 ? g.neg + 1 : 0;
  if (g.neg >= BANKRUPTCY_DAYS) { g.over = true; setSpeed(0); }
  if (g.day % 30 === 0) save();
  render();
}


function netUnitRevenue(game, perUnit = game.revenuePerUnit ?? game.price*.7) {
  return perUnit * (1-(game.engineRoyalty || 0)) * (game.pub ? 1-PUB.share : 1);
}

function trackGameFinance(game, field, amount) {
  if (!amount) return;
  var week = Math.max(0, Math.floor((g.day-game.day-1)/7));
  var entry = game.financeWeeks[week] || (game.financeWeeks[week] = {rev:0,cost:0});
  entry[field] += amount;
  game[field] += amount;
}

function boostCatalogSales(game, multiplier) {
  game.pot *= multiplier;
  if (game.markets) game.markets.forEach(market => { market.potential *= multiplier; });
}

function salesSeason(game, age) {
  var month = dt().getMonth();
  var seasonal = [.99,.91,.95,1.01,1.04,.96,.90,.94,1.03,1.07,1.14,1.29][month];
  var wave = Math.sin((g.day-game.day)*2.25+game.day*.61) + .68*Math.sin(g.day*.32+game.day*.19);
  return seasonal * (1 + (month===11 ? .23*Math.exp(-age/32) : 0)) * (1+.095*wave);
}

function trackStock(game, filled, lost, value, studio) {
  var week = Math.floor(g.day/7);
  var history = (game.stockWeeks ||= {});
  var entry = history[week] ||= {filled:0,lost:0,value:0};
  for (var stat of [entry,studio]) {
    stat.filled += filled;
    stat.lost += lost;
    stat.value += value;
  }
  game.lost = (game.lost || 0)+lost;
  game.lostRevenue = (game.lostRevenue || 0)+value;
}

function sellCopies(game, physical) {
  var age = g.day-game.day;
  if (age < 1 || !isOnSale(game)) return 0;
  var curve = game.isHit
    ? .56/58*Math.exp(-age/58) + .44/550*Math.exp(-age/550)
    : .63/43*Math.exp(-age/43) + .37/230*Math.exp(-age/230);
  curve *= salesSeason(game,age) * (1 + .8*gameHype(game)/150*Math.exp(-age/470));
  curve *= 1-(game.live?.saturation || 0)*.28;
  var units = 0, revenue = 0, missed = 0;
  var promo = promotionActive(game);
  var extra = 0;
  for (var boost of [game.relaunch,game.updateBoost,game.sequelBoost,game.communityBoost]) {
    var days = boost ? g.day-boost.day : 0;
    if (days>=1 && days<=(boost.days || 30)) extra += boost.units/(boost.days || 30);
  }
  var markets = game.markets || [{
    platform:(game.platforms || [game.plat]).includes('Console') ? 'Console' : game.plat,
    potential:game.pot, perUnit:game.revenuePerUnit ?? game.price*.7, remainder:game.fr || 0,
  }];
  for (var market of markets) {
    var fanDemand = (market.fanPotential || 0)*(.76/28*Math.exp(-age/28)+.24/95*Math.exp(-age/95));
    var expected = market.remainder + market.potential*curve*(promo ? PROMOTION.demand : 1) + fanDemand
      + (game.pot>0 ? extra*market.potential/game.pot : 0);
    var wanted = Math.floor(expected);
    market.remainder = expected-wanted;
    var price = game.prices?.[market.platform] ?? game.price;
    var physicalEdition = market.physical ?? (market.platform==='Console' && price>0);
    var margin = market.dynamicPrice ? price*.7-(physicalEdition ? physicalCost(game) : 0) : market.perUnit;
    var discount = promo ? price*PROMOTION.discount*.7 : 0;
    var unitRevenue = netUnitRevenue(game,margin-discount);
    var sold = wanted;
    if (physicalEdition) {
      sold = Math.min(wanted,physical.remaining);
      var lost = wanted-sold;
      missed += lost;
      physical.remaining -= sold;
      trackStock(game,sold,lost,lost*Math.max(0,unitRevenue),physical.totals || {filled:0,lost:0,value:0});
      if (lost && !game.stockout) {
        game.stockout = true;
        L('Rupture de stock sur « ' + game.name + ' ».','ko');
      }
    }
    units += sold;
    revenue += sold*unitRevenue;
  }
  if (!game.markets) game.fr = markets[0].remainder;
  game.u += units;
  (game.recentSales ||= []).push({day:g.day,units:units,lost:missed});
  game.recentSales = game.recentSales.filter(sale=>sale.day>g.day-7);
  var calendarWeek = Math.floor(g.day/7)-Math.floor(game.day/7);
  (game.h ||= [])[calendarWeek] = (game.h[calendarWeek] || 0)+units;
  earn(revenue,'Ventes nettes de « '+game.name+' »');
  trackGameFinance(game,'rev',revenue);
  return revenue;
}

function serverCapacity() {
  return (g.servers || []).reduce((total,contract)=>total+SERVER_TYPES[contract.type].capacity,0);
}

function serviceSnapshot() {
  var games = g.rel.filter(game=>game.hosted && isOnSale(game));
  var demand = games.reduce((total,game)=>total+Math.ceil((game.live?.players || 0)*(game.mmo ? .42 : .24)),0);
  return {demand:demand,capacity:serverCapacity()};
}

function runLiveGame(game, newCopies, service) {
  if (!isOnSale(game)) return 0;
  var mode = game.monetization || 'none';
  var pressure = game.storePressure || 0;
  var harmful = mode==='advantage' ? 1 : 0;
  var crowding = game.hosted
    ? (service.capacity===0 ? 1 : Math.max(0,1-service.capacity/Math.max(1,service.demand))) : 0;
  var age = g.day-game.day;
  var players = game.live;
  var revenue = 0;
  var updated = game.updateBoost && g.day-game.updateBoost.day<=30;
  if (game.hosted || mode!=='none' || game.f2p) {
    players = game.live ||= {players:0,departed:0,saturation:0,storeRevenue:0};
    var joining = newCopies*(.74-.45*crowding);
    var returning = updated && age>0 ? (game.updateBoost.returns || 0)/30 * (1-crowding) : 0;
    var churn = (.009 + Math.max(0,68-game.score)*.00036 + .055*crowding
      + pressure*(harmful ? .006 : .0018))*(updated ? .82 : 1);
    var leaving = Math.min(players.players,players.players*churn);
    players.players = Math.min(game.u,Math.max(0,players.players+joining+returning-leaving));
    players.departed += leaving;
    players.saturation = crowding;
    if (mode!=='none') {
      var spendPerPlayer = (harmful ? .010 : .007) * (1 + pressure*(harmful ? .68 : .42));
      revenue = players.players*spendPerPlayer*(1-.65*crowding)*(1+game.sc*.22);
      revenue = netUnitRevenue(game,revenue*.7);
      players.storeRevenue += revenue;
      earn(revenue,'Achats en boutique dans « '+game.name+' »');
      trackGameFinance(game,'rev',revenue);
    }
    if (players.players>10 && (harmful || crowding>.12 || pressure===3)) {
      var complaints = (harmful ? .008*pressure*pressure : .003*pressure) + .065*crowding;
      g.rep = Math.max(0,g.rep-complaints*Math.min(1,players.players/100));
    }
  }
  updateLicenseFans(game,newCopies,crowding,harmful*pressure,Boolean(updated));
  return revenue;
}

function updateLicenseFans(game, copies, crowding, pressure, updated) {
  var license = (g.licenses || []).find(entry=>entry.id===game.franchiseId);
  if (!license) return;
  var attitude = clamp(-.08,.36,(game.score-46)*.009 - .18*crowding - .048*pressure);
  var fans = Math.max(0, copies*attitude * (game.installment>1 ? .75 : 1));
  var losses = license.fans*(.00025*pressure + .00075*crowding
    + (game.installment>1 && game.score<53 && g.day-game.day<60 ? .0014 : 0));
  if (updated) losses *= .42;
  license.fans = Math.max(0,license.fans+fans-losses);
  var other = g.licenses.filter(entry=>entry.id!==license.id && g.rel.some(r=>r.franchiseId===entry.id));
  if (other.length && fans>0) other[(g.day+game.day)%other.length].fans += fans*.04;
}

function leaseServer(index) {
  var plan = SERVER_TYPES[index];
  if (g.over || !plan || currentYear()<plan.year || g.cash<plan.cost) return;
  g.servers.push({type:index});
  L('Contrat d’hébergement signé pour un '+plan.name.toLowerCase()+'.');
  save();
  render();
}

function endServer(index) {
  var contract = g.servers[index];
  if (!contract) return;
  ask('Résilier ce contrat ? Les joueurs se partageront la capacité restante.',function() {
    var position = g.servers.indexOf(contract);
    if (position<0) return;
    g.servers.splice(position,1);
    save();
    render();
  });
}

function sellAddons(game) {
  var revenue = 0;
  for (var addon of game.addons || []) {
    var age = g.day-addon.day;
    if (age < 1 || age > 240) continue;
    var interested = Math.min(game.u, game.u*addon.attach);
    var expected = Math.max(0,interested-addon.u) * (.020 + .043*Math.exp(-age/25)) + addon.remainder;
    var units = Math.min(Math.max(0,game.u-addon.u),Math.floor(expected));
    addon.remainder = expected-Math.floor(expected);
    var value = units * netUnitRevenue(game,addon.price*.7);
    addon.u += units;
    addon.rev += value;
    revenue += value;
    earn(value,'Ventes du DLC « ' + addon.name + ' »');
    trackGameFinance(game,'rev',value);
  }
  return revenue;
}

function gameHype(game) {
  var age = Math.max(0,g.day-game.day);
  var hype = (game.launchHype || 0)*Math.exp(-age/(game.isHit ? 88 : 56));
  if (game.adCampaign) {
    var since = Math.max(0,g.day-game.adCampaign.day);
    hype += game.adCampaign.hype*Math.exp(-since/35);
  }
  for (var boost of [game.relaunch,game.updateBoost,game.sequelBoost,game.communityBoost]) {
    if (boost) hype += boost.hype*Math.max(0,1-(g.day-boost.day)/(boost.days || 30));
  }
  return clamp(0,150,Math.round(hype));
}

function releasedCampaignCost(game, size) {
  return Math.round(campaignCost(game,size)*.30);
}

function releasedCampaignBoost(game,size) {
  var age = Math.max(0,g.day-game.day);
  var relevance = .22+.78*Math.exp(-age/280);
  return Math.max(0,Math.round((12+24*Math.sqrt(size))*relevance*(1-gameHype(game)/150)));
}

function releasedCampaignIssue(game) {
  if (g.over || !isOnSale(game)) return 'Les campagnes sont réservées aux jeux encore en vente.';
  if (game.adCampaign && g.day-game.adCampaign.day<CAMPAIGN_COOLDOWN)
    return 'L’équipe marketing attend encore '+(CAMPAIGN_COOLDOWN-(g.day-game.adCampaign.day))+' jours avant une nouvelle campagne.';
  if (gameHype(game)>=135) return 'Le public parle déjà beaucoup de ce jeu. Attends que l’intérêt retombe.';
  return '';
}

function purchaseReleasedCampaign(index,size) {
  var game = g.rel[index];
  if (!game || !CAMPAIGNS.some(campaign=>campaign.size===size)) return;
  var issue = releasedCampaignIssue(game);
  var cost = releasedCampaignCost(game,size);
  if (issue) return toast(issue,'wa');
  if (g.cash<cost) return toast('La trésorerie ne peut pas financer cette campagne.','ko');
  var boost = releasedCampaignBoost(game,size);
  var residual = game.adCampaign ? game.adCampaign.hype*Math.exp(-(g.day-game.adCampaign.day)/35) : 0;
  game.adCampaign = {day:g.day,hype:boost+residual};
  spend(cost,'Campagne après sortie pour « '+game.name+' »');
  trackGameFinance(game,'cost',cost);
  L('La campagne remet « '+game.name+' » sous les projecteurs : +'+boost+' de hype.','ok');
  closeModal();
  save();
  render();
}

function promotionState(game) {

  if (g.day < (game.promoNext || 0)) return 'Nouvelle promotion dans ' + (game.promoNext-g.day) + ' jours.';
  return '';
}

function migrateGameFinance(game, day) {
  game.launchCost = game.cost || 0;
  game.financeWeeks = {};
  var tracked = 0;
  (game.h || []).forEach(function(units, week) {
    var revenue = units * netUnitRevenue(game);
    if (revenue) game.financeWeeks[week] = {rev:revenue,cost:0};
    tracked += revenue;
  });
  var remaining = game.rev - tracked;
  if (Math.abs(remaining) >= .01) {
    var week = Math.max(0, Math.ceil((day-game.day)/7)-1);
    var entry = game.financeWeeks[week] || (game.financeWeeks[week] = {rev:0,cost:0});
    entry.rev += remaining;
  }
  game.financeEstimated = true;
}

function monthly() {
  spend(g.staff.reduce((total, staff) => total + (staff.brut || 0) * 1.42, 0), 'Salaires et charges sociales');
  spend(OFF[g.off].rent, 'Loyer des locaux');
  g.factories.forEach(f => spend(f.cost || 0, 'Fabrication : ' + f.n));
  (g.servers || []).forEach(contract => {
    var plan = SERVER_TYPES[contract.type];
    spend(plan.cost,'Hébergement : '+plan.name);
  });
  if (g.loan) {
    var l = g.loan, i = l.left * LOAN_RATE, pr = Math.min(l.left, l.pay - i);
    l.left -= pr;
    recordCash(-pr, 'Prêt bancaire : remboursement du capital');
    spend(i, 'Prêt bancaire : intérêts');
    if (l.left < 1) g.loan = null;
  }
  g.fin.unshift({d: dt().toLocaleDateString('fr-FR', {month:'short', year:'2-digit'}), rev: g.m.rev, cost: g.m.cost});
  g.fin.length = Math.min(g.fin.length, 12);
  g.revenueHistory.push({label: dt().toLocaleDateString('fr-FR', {month:'short', year:'2-digit'}), revenue: g.m.rev});
  g.revenueHistory = g.revenueHistory.slice(-48);
  g.m = {rev:0, cost:0};
  g.cand = cands();
  for (var ei = 0; ei < g.engines.length; ei++) {
    var e = g.engines[ei];
    if (e.id === 'basic') continue;
    var techCount = (e.techs && e.techs.length) || 0;
    if (techCount === 0) continue;
    var quality = engineMarketAppeal(techCount,g.day-(e.created || 0),e.price || 0,e.royalty || 0);
    var newBuyers = Math.floor(quality * 0.004 * R(0.5, 1.2) + Math.random());
    e.users = Math.min(30, Math.max(0, Math.floor((e.users || 0) * 0.94 + newBuyers)));
    if (newBuyers > 0 && (e.price || 0) > 0) {
      var rev = newBuyers * e.price;
      earn(rev, 'Licences du moteur « ' + e.name + ' »'); e.revenue = (e.revenue || 0) + rev;
    }
    if (e.users > 0 && (e.royalty || 0) > 0) {
      var expected = e.users * 0.03;
      var numRel = Math.floor(expected) + (Math.random() < (expected % 1) ? 1 : 0);
      for (var rj = 0; rj < numRel; rj++) {
        var gameRev = R(10000, 150000) * (techCount / 5);
        var cut = Math.round(gameRev * e.royalty);
        earn(cut, 'Redevances du moteur « ' + e.name + ' »'); e.revenue = (e.revenue || 0) + cut;
      }
    }
  }
  if (Math.random() < .22) runMonthlyEvent();
}

function yearly() {

}

function projectUpfront(p) {

    var setup = [350,950,3500,12500][p.sc] * DLC_PROFILES[p.dlcProfile].setup * yearPointsScale();
    return {kits:0,translations:0,setup:Math.round(setup/50)*50};
  }
  var kits = p.platforms.reduce((total, pl) => total + platFee(pl,p.sc), 0);
  var translations = p.translations.reduce(function(total,id) {
    return total + translationCost(TRANSLATIONS.find(lang => lang.id === id), p.sc);
  }, 0);
  return {
    kits:p.published ? Math.round(kits * (1-PUB.kit)) : kits,
    translations:p.published ? Math.round(translations * (1-PUB.localization)) : translations,
    setup:0,

}

function dlcPrice(sc, profile) {

function projectWork(choices) {
  var workload = plannedWork(choices.sc,choices.genre,choices.platforms,choices.features);
  if (choices.dlcBaseId === undefined) return workload;
  var scale = DLC_PROFILES[choices.dlcProfile].effort;
  return Object.fromEntries(Object.entries(workload).map(([role,points]) => [role,points*scale]));
}

function projectSchedule(team, work, engine) {
  var staff = g.staff.filter(member => member.teamId === team.id);
  var rates = {prog:0, design:0, art:0, qa:0};
  var efficiency = coordination(staff.length)*engineWorkMultiplier(engine);
  for (var member of staff) rates[member.role] += workRate(member,team) * efficiency;
  var missing = CORE_ROLES.filter(role => !rates[role]);
  if (missing.length) return {missing:missing};
  var focus = PRIORITIES.balanced;
  var firstTests = .5 * work.prog / rates.prog;
  var coreSchedule = CORE_ROLES.map(function(role) {
    var roleDays = work[role] / rates[role];
    return roleDays <= firstTests ? roleDays : firstTests + (roleDays-firstTests) / (1-focus.test);
  });
  var coreDays = Math.max(...coreSchedule);
  var shared = CORE_ROLES.reduce((total,role) => total + rates[role],0);
  var earlyTests = coreDays * rates.qa * 1.32 + Math.max(0,coreDays-firstTests) * shared * focus.test * .9;
  var extraDays = Math.max(0,work.qa-earlyTests)/(rates.qa*1.32 + shared*focus.finished*.9);
  return {days:Math.ceil(coreDays + extraDays), missing:missing,
    bottleneck:extraDays > 4 ? 'qa' : CORE_ROLES[coreSchedule.indexOf(coreDays)]};
}

function onlineSupport(sc, featureIds) {
  if (!featureIds.includes('online') && !featureIds.includes('live')) return 0;
  return [160,650,4250,23000][sc] * (featureIds.includes('live') ? 2 : 1);
}

  var issue = dlc ? '' : platformIssue(p.platforms);
  $('#platformWarning').textContent = issue;
  $('#startDev').disabled = Boolean(issue);
  if (dlc) $('#projectPrice').textContent = fmt(dlcPrice(p.sc,p.dlcProfile));
  else {
    updatePub();
    updateProjectPrice();
    updateTransEstimate(p,upfront.translations);
    $('#licenseChoice').hidden = !$('#pSequel').checked;
    $('#licenseNameGroup').hidden = $('#pSequel').checked;
    var pressure = $('#storePressure');
    if (pressure) pressure.disabled = p.monetization==='none';
  }
  var platforms = Math.max(1, p.platforms.length);
  $$('#featureList input').forEach(function(input) {
    var feature = FEATURES.find(f => f.id === input.value);
    input.closest('label').querySelector('small').textContent =
      nb(featurePoints(feature,p.sc,platforms) * (dlc ? DLC_PROFILES[p.dlcProfile].effort : 1)) + ' pts' +
      (feature.genres ? ' · ' + (featureFit(feature,p.genre) > 1 ? 'adaptée au genre' : 'peu adaptée au genre') : '');
  });
  if (!p.platforms.length) { el.textContent = ''; return; }
  var work = projectWork(p);
  var team = curTeam();
  var schedule = projectSchedule(team,work,getEngine($('#engsel')?.value || draftSource()?.engineId));
  var points = nb(sum(work)) + ' points prévus.';
  if (schedule.missing.length) {
    el.className = 'warn-box wa';
    el.textContent = points + ' Recrutement nécessaire : ' + schedule.missing.map(role => ROLES[role]).join(', ') + '.';
    return;
  }
  var cost = sum(upfront) + schedule.days * projectDailyCost(team);
  var featureIds = p.features.map(feature => feature.id);
  var support = dlc || p.hosted || featureIds.includes('mmo') ? 0 : onlineSupport(p.sc,featureIds);
  var releaseReserve = g.cash - sum(upfront) - schedule.days * burn() / 30.4;
  var hosted = p.hosted || featureIds.includes('mmo');

  var needsOnline = !dlc && (p.genre === 'Battle Royale' || featureIds.includes('br')) && !featureIds.includes('online');
  el.className = 'warn-box ' + (releaseReserve < 0 ? 'wa' : 'mu');
  el.textContent = points + ' Environ ' + nb(schedule.days) + ' jours et ' + fmt(cost) +
    ' de budget avant la sortie. Poste le plus lent : ' + DIS[schedule.bottleneck] + '.' +
    (support ? ' Support après la sortie : ' + fmt(support) + ' par mois pendant six mois.' : '') +
    (hosted && serverCapacity()===0 ? ' Il faudra louer des serveurs avant la publication.' : '') +
    (needsOnline ? ' Ajoutez le multijoueur en ligne pour le Battle Royale.' : '') +
    (releaseReserve < 0 ? ' Trésorerie insuffisante jusqu’à la sortie sans autres revenus.' : '');
}

function sequelAppeal(source, genre) {

  var recency = clamp(.52,1,1-Math.max(0,g.day-source.day-330)/2300);
  return (loyalFans+recentHype)*recency*(genre===source.genre ? 1 : .44);
}

function startProj() {
  var team = curTeam();
  if (g.over || team.proj) return toast('Cette équipe ne peut pas démarrer un autre projet.', 'ko');
  var choices = projectChoices();
  var dlc = choices.dlcBaseId !== undefined;
  var source = dlc ? draftSource() : lastLicenseGame(choices.licenseId);
  var issue = dlc ? dlcIssue(source) : platformIssue(choices.platforms);
  if (!issue && choices.licenseId) issue = sequelIssue(source);
  if (issue) return toast(issue,'ko');

  var sc = choices.sc, gn = choices.genre, plats = choices.platforms;
  var pub = choices.published;
  var upfront = projectUpfront(choices);
  if (g.cash < sum(upfront))
    return toast('Trésorerie insuffisante pour les frais de démarrage (' + fmt(sum(upfront)) + ').', 'ko');
  var engineId = dlc ? (getEngine(source.engineId) ? source.engineId : 'basic') : $('#engsel').value;
  var engine = getEngine(engineId);
  if (!engine) return toast('Moteur invalide.', 'ko');
  var f2p = Boolean(choices.f2p);
  if (f2p && currentYear()<FREE_YEAR) return toast('La distribution gratuite est disponible à partir de '+FREE_YEAR+'.','ko');
  var monetization = choices.monetization || 'none';
  if (monetization!=='none' && currentYear()<STORE_YEAR)
    return toast('Les boutiques intégrées sont disponibles à partir de '+STORE_YEAR+'.','ko');
  var features = choices.features.map(feature=>feature.id);
  var mmo = !dlc && features.includes('mmo');
  var hosted = !dlc && (choices.hosted || mmo);
  if (hosted && currentYear()<SERVER_YEAR) return toast('L’hébergement est disponible à partir de '+SERVER_YEAR+'.','ko');
  if (mmo && sc===0) return toast('Un monde persistant exige au moins l’ampleur d’un jeu indé.','ko');
  if (hosted && !features.includes('online'))
    return toast('Ajoute le multijoueur en ligne pour héberger les parties.','ko');

  var inherited = dlc ? (source.features || []) : [];
  var available = id => features.includes(id) || inherited.includes(id);
  if (features.includes('crossplay') && (plats.length < 2 || !available('online')))
    return toast('Le jeu multiplateforme nécessite deux plateformes ou plus et le multijoueur en ligne.', 'ko');
  if (features.includes('season-pass') && !available('live'))
    return toast('Le season pass nécessite le service continu.', 'ko');
  if (features.includes('anti-cheat') && !available('online'))
    return toast('L’anti-triche nécessite le multijoueur en ligne.', 'ko');
  if (((!dlc && gn === 'Battle Royale') || features.includes('br')) && !available('online'))
    return toast('Le Battle Royale nécessite le multijoueur en ligne.', 'ko');

  var langs = choices.translations;
  var n = $('#pn').value.trim() || 'Sans titre';
  var recent = g.rel.slice(0,3);
  var avgScore = recent.length ? recent.reduce((total,r) => total+r.score,0)/recent.length : 50;
  var initHype = clamp(0,40,g.rep/4 + (avgScore-60)/2);
  if (source && !dlc) initHype += Math.round(40*sequelAppeal(source,gn));
  if (pub) initHype = Math.max(initHype, PUB.hype);

  var isOwn = g.engines.some(e => e.id === engineId);
  spend(upfront.kits, 'Kits de développement (' + plats.join(', ') + ') de « ' + n + ' »');
  spend(upfront.translations, 'Traductions de « ' + n + ' »');
  if (dlc) {
    spend(upfront.setup,'Préparation du DLC « ' + n + ' »');
    trackGameFinance(source,'cost',upfront.setup);
  }
  team.proj = {
    name:n, genre:gn, plat:plats[0], platforms:plats, sc:sc, need:projectWork(choices),
    done:{prog:0,design:0,art:0,qa:0}, craft:{prog:0,design:0,art:0}, priority:'balanced', polish:0,
    bugs:0, hype:dlc ? Math.min(35,gameHype(source)/2) : initHype, spent:sum(upfront),
    features:features, engineId:engineId, engineRoyalty:isOwn ? 0 : (engine.royalty || 0),
    polishing:false, f2p:f2p, monetization:monetization, storePressure:monetization==='none'?0:choices.storePressure,
    hosted:hosted, mmo:mmo, pub:pub, pubFloor:pub ? PUB.floor : 0, startDay:g.day,
    translations:langs, translationCost:upfront.translations, translationRatio:translationShareRatio(langs),
  };
  if (dlc) {
    team.proj.dlcBaseId = source.id;
    team.proj.dlcProfile = choices.dlcProfile;
  } else if (source) {
    team.proj.sequelOf = source.id;
    team.proj.franchiseId = source.franchiseId;
    team.proj.installment = nextInstallment(source);
  } else {
    var label = $('#licenseName')?.value.trim() || n;
    team.proj.franchiseId = createLicense(label.slice(0,80)).id;
    team.proj.installment = 1;
  }
  clearProjectForm();
  L('Début du développement de « ' + n + ' » par ' + team.name + '.');
  sfxTab();
  save();
  render();
}

function campaignCost(project, size) {
  var fraction = project.dlcBaseId === undefined ? 1 : DLC_PROFILES[project.dlcProfile].effort;
  return Math.round(SC[project.sc].mk * fraction * size);
}

function mkt(f) {
  var p = curProj();
  if (!p) return;
  var base = p.dlcBaseId === undefined ? null : g.rel.find(game => game.id===p.dlcBaseId);
  var a = campaignCost(p,f);
  if (g.cash < a) return toast('Trésorerie insuffisante pour cette campagne marketing (' + fmt(a) + ').','ko');
  spend(a, 'Campagne marketing pour « ' + p.name + ' »'); p.spent += a;
  if (base) trackGameFinance(base,'cost',a);
  var boost = 25*Math.sqrt(f)*(1-p.hype/150);
  p.hype = Math.min(150,p.hype+boost);
  p.campaignHype = Math.min(150,(p.campaignHype || 0)+boost);
  render();
}


function genresShareAudience(before, after) {
  if (before===after) return true;
  return [
    ['Action','FPS','Battle Royale','Survival','Horreur'],
    ['Aventure','RPG','Metroidvania','Film interactif','Roguelike'],
    ['Stratégie','RTS','Gestion','Simulation','MOBA'],
    ['Simulation','Sport'], ['Puzzle','Aventure']
  ].some(group=>group.includes(before) && group.includes(after));
}

function sequelReception(predecessor, project) {
  var notices = [];
  var license = getLicense(predecessor.franchiseId);
  var prior = g.rel.filter(game=>game.franchiseId===predecessor.franchiseId).slice(0,3);
  var regular = Array.from(new Set(prior.flatMap(game=>game.platforms)))
    .filter(platform=>prior.filter(game=>game.platforms.includes(platform)).length>prior.length/2);
  var missing = regular.filter(platform=>!project.platforms.includes(platform));
  var radical = !genresShareAudience(predecessor.genre,project.genre);
  function fanLoss(fraction) {
    if (!license) return 0;
    var lost = Math.min(license.fans,Math.floor(license.fans*fraction));
    license.fans -= lost;
    return lost;
  }
  if (missing.length) {
    var platformLoss = fanLoss(Math.min(.30,.16+missing.length*.045));
    notices.push(['Les fans de « '+predecessor.name+' » cherchent la suite sur '+missing.join(', ')+'. Le changement de plateforme a déçu leur communauté. −'+nb(platformLoss)+' fans.','ko']);
  }
  if (radical) {
    var genreLoss = fanLoss(.20);
    notices.push(['Le passage de « '+predecessor.genre+' » à « '+project.genre+' » divise les habitués de la licence. −'+nb(genreLoss)+' fans.','ko']);
  }
  if (isOnSale(predecessor)) {
    predecessor.sequelBoost = {day:g.day,days:45,hype:radical ? 6 : 11,
      units:Math.min(predecessor.pot*.04,predecessor.u*.065)*(radical ? .55 : 1)};
    notices.push(['La sortie de la suite remet « '+predecessor.name+' » en lumière. Les ventes de l’ancien jeu reprennent un peu.','ok']);
  }
  return notices;
}

function organicLaunchEvents(game, project) {
  var features = project.features || [];
  if (features.includes('tutorial') && coverage(project,'qa')>=.85 && game.score>=60) {
    game.launchHype += 5;
    L('Les premiers joueurs partagent le tutoriel de « '+game.name+' » avec leurs amis. +5 de hype.','ok');
  }
  if (project.translations?.length>=3 && game.score>=62) {
    game.launchHype += 7;
    L('Des communautés de plusieurs pays relaient la sortie de « '+game.name+' » grâce à ses traductions. +7 de hype.','ok');
  }
  if (coverage(project,'qa')<.73 && game.bug>=10) {
    game.launchHype -= 10;
    L('Les premiers comptes rendus de « '+game.name+' » pointent des bugs de lancement. −10 de hype.','ko');
  }
  if (features.includes('access') && coverage(project,'qa')>.85) {
    game.launchHype += 5;
    L('Les options d’accessibilité de « '+game.name+' » permettent à de nouveaux joueurs de rejoindre la communauté. +5 de hype.','ok');
  }
  if (project.platforms.length>=2 && features.includes('crossplay')) {
    game.launchHype += 6;
    L('Les amis séparés par leur matériel se retrouvent sur « '+game.name+' » grâce au jeu multiplateforme. +6 de hype.','ok');
  }
  if (project.monetization==='advantage' && project.storePressure>=3) {
    game.launchHype -= 8;
    L('La boutique de « '+game.name+' » fait débat : des joueurs se plaignent des avantages payants. −8 de hype.','ko');
  }
  game.launchHype = clamp(0,150,game.launchHype);
}

function organicCatalogEvents(game) {
  var age = g.day-game.day;
  if (age===35 && game.features?.includes('mod-support') && game.u>=40 && game.score>=60) {
    game.communityBoost = {day:g.day,days:60,hype:10,units:Math.min(game.pot*.038,game.u*.05)};
    L('La communauté de « '+game.name+' » publie ses premiers mods et attire de nouveaux joueurs. +10 de hype.','ok');
  }
  if (age===21 && game.hosted && game.live?.saturation>.30) {
    game.launchHype = Math.max(0,(game.launchHype || 0)-14);
    L('Les longues files d’attente refroidissent les joueurs de « '+game.name+' ». Augmente la capacité dans Serveurs.','ko');
  }
  if (age===18 && game.features?.includes('photo-mode') && game.u>=40 && game.score>=64) {
    game.communityBoost = {day:g.day,days:25,hype:8,units:Math.min(game.pot*.018,game.u*.03)};
    L('Les captures prises dans « '+game.name+' » circulent dans les communautés de joueurs. +8 de hype.','ok');
  }
}

function release(team = curTeam()) {
  var p = team.proj;
  if (!p || g.over) return;
  if (!canRelease(p)) return toast('Terminez la production et au moins 45 % des tests.', 'wa');
  if (p.hosted && serverCapacity()<=0) return toast('Loue un serveur dans l’onglet Serveurs avant la sortie.','ko');
  var score = projectedScore(p);
  if (p.dlcBaseId !== undefined) return publishAddon(team,p,score);
  var predecessor = p.sequelOf ? g.rel.find(game => game.id === p.sequelOf) : null;
  var sequelNotices = predecessor ? sequelReception(predecessor,p) : [];
  var plats = p.platforms || [p.plat];
  var commercialAppeal = Math.pow(score/65,3.65)
    * (.86 + Math.min(g.rep,100)/270) * featureSalesMult(p)
    * (.68 + .32 * (p.translationRatio ?? 1)) * satur(p.genre) * (p.pub ? PUB.distribution : 1)
    * (predecessor ? 1+sequelAppeal(predecessor,p.genre) : 1) / (1 + .22 * (plats.length - 1));
  var markets = plats.map(function(platform) {
    var options = Object.assign({}, p, {plat:platform});
    var scale = p.sc>=2 ? 1+(yearPointsScale(p.sc)-1)*(score>=80 ? .94 : .64) : 1;
    var potential = SC[p.sc].base * scale * yearRevenueMult() * platformAudience(platform,p.genre,currentYear()) *
      demandFor(p.genre) * commercialAppeal;
    return {platform:platform, potential:potential * mobileUnitMult(options), perUnit:computeRevenuePerUnit(options),
      physical:platform==='Console' && gamePrice(options)>0, dynamicPrice:true, remainder:0};
  });
  var pot = markets.reduce((total, market) => total + market.potential,0);
  if (predecessor && pot>0) {
    var followers = getLicense(predecessor.franchiseId)?.fans || 0;
    var conversion = clamp(.14,.56,.31+(score-65)*.005+p.hype*.0007);
    var familiarity = p.genre===predecessor.genre ? 1 : .38;
    var loyalDemand = Math.min(pot*.42,followers*conversion*familiarity);
    markets.forEach(market=>{market.fanPotential = loyalDemand*market.potential/pot;});
  }
  var revenuePerUnit = markets.reduce((total, market) => total + market.potential * market.perUnit,0) / pot;
  var isHit = score >= 80;

  var prices = Object.fromEntries(plats.map(pl => [pl, gamePrice(p, pl)]));

  var record = {
    id: 'g' + Date.now() + '_' + Math.floor(Math.random()*1000),
    name: p.name, genre: p.genre, plat: plats[0], platforms: plats, sc: p.sc, score: score,
    price: prices[plats[0]], prices: prices, revenuePerUnit: revenuePerUnit, pot: pot,
    day: g.day, u: 0, rev: 0, cost: p.spent, launchCost:p.spent, financeWeeks:{}, markets:markets, bug: bugPct(p), patched: 0, h: [], lost: 0,
    col: g.rel.length % 6, engineRoyalty: p.engineRoyalty || 0,
    dlcs:0, addons:[], support:p.hosted ? 0 : onlineSupport(p.sc,p.features), launchHype:clamp(0,150,(p.hype || 0)+Math.max(0,score-52)*1.75),
    hosted:Boolean(p.hosted), mmo:Boolean(p.mmo), monetization:p.monetization || 'none', storePressure:p.storePressure || 0,
    features:p.features, engineId:p.engineId, sequelOf:p.sequelOf, installment:p.installment || 1,
    isHit: isHit, f2p:p.f2p, freePlatforms:p.freePlatforms, pub:!!p.pub,
    startDay: p.startDay, devDays: g.day - (p.startDay ?? g.day),
    translations: p.translations || [],
  };
  record.franchiseId = p.franchiseId || createLicense(p.name).id;
  organicLaunchEvents(record,p);
  g.rel.unshift(record);
  g.graphGame = 0;

  if (p.features.indexOf('lootboxes') >= 0) {
    g.rep = Math.max(0, g.rep - 3);
    L('Loot boxes : -3 réputation.', 'ko');
  }

  var repGain = (score-58)/6;
  g.rep = Math.max(0, Math.min(100, g.rep + repGain));

  L('« '+p.name+' » sort avec une note de '+score+'/100'+(isHit?' — HIT !':'')+'.', isHit ? 'ok' : undefined);
  sequelNotices.forEach(([message,tone])=>L(message,tone));

  team.proj = null; team.crunch = false;
  setClock(false); save();

  var modalBody = isHit
    ? '<h3 style="border-left:0;padding:0;text-align:center;color:var(--gold)">🏆 HIT !</h3>' +
       '<div class="big" id="sc">0</div>' +
       '<p style="font-size:17px;font-weight:600;color:var(--gold)">« ' + escapeAttribute(record.name) + ' » est un phénomène.</p>' +
       '<p>' + press(score) + '</p>' +
       '<div class="bt" style="justify-content:center"><button class="go" onclick="closeModal()">Continuer</button></div>'
    : '<h3 style="border-left:0;padding:0;text-align:center">🎉 « ' + escapeAttribute(record.name) + ' » est sorti !</h3>' +
       '<div class="big" id="sc">0</div>' +
       '<p>' + press(score) + '</p>' +
       (record.bug>20?'<p class="wa">Attention : de nombreux bugs signalés.</p>':'') +
       '<div class="bt" style="justify-content:center"><button class="go" onclick="closeModal()">Continuer</button></div>';
  modal(modalBody);
  render();
  countUp(score);
  if (isHit) { confetti(); jingle([523,659,784,1047,1319]); }
  else if (score >= 75) { confetti(); jingle([523,659,784,1047]); }
  else if (score < 45) sfxFail();
  else jingle([440,554]);
}


function publishAddon(team, project, score) {
  var game = g.rel.find(record => record.id === project.dlcBaseId);
  if (!game) return toast('Le jeu de base est introuvable.', 'ko');
  var profile = DLC_PROFILES[project.dlcProfile];
  var audience = profile.audience * Math.pow(.88,Math.min(game.dlcs || 0,6));
  var attach = clamp(.04,.58,audience * Math.pow(score/65,1.7) * (.91 + project.hype/320));
  (game.addons ||= []).push({
    name:project.name, day:g.day, score:score, price:dlcPrice(project.sc,project.dlcProfile),
    cost:project.spent, u:0, rev:0, attach:attach, remainder:0,
  });
  game.dlcs = (game.dlcs || 0)+1;
  game.lastDlcDay = g.day;
  var relaunchUnits = isOnSale(game) ? Math.min(game.u*.028,game.pot*.020) * clamp(.2,1.1,score/70) : 0;
  game.relaunch = {day:g.day, units:relaunchUnits, hype:clamp(3,12,Math.round(score/8))};
  team.proj = null;
  team.crunch = false;
  setClock(false);
  L('Le DLC « ' + project.name + ' » est disponible pour « ' + game.name + ' ».', 'ok');
  modal('<h3>DLC publié</h3><p><strong>' + escapeAttribute(project.name) + '</strong> · ' + score +
    '/100 · ' + fmt(dlcPrice(project.sc,project.dlcProfile)) + '</p><p>Le DLC est vendu aux propriétaires du jeu de base. ' +
    (relaunchUnits > 0 ? 'La sortie relance légèrement les ventes du jeu pendant 30 jours.' : '') +
    '</p><div class="bt" style="justify-content:center"><button class="go" onclick="closeModal()">Continuer</button></div>');
  jingle([523,659,784]);
  save();
  render();
}

function showReleaseDecision() {
  if (g.over) return;
  var team = g.teams.find(candidate => candidate.proj?.launchDecision === 'pending');
  if (!team) return;
  var project = team.proj;
  if (g.speed) {
    project.resumeAfterDecision = true;
    setClock(false);
    renderHeader();
  }
  if ($('#md')) return;
  modal('<h3 id="releaseDecisionTitle">Développement terminé</h3><p><strong>' +
    escapeAttribute(project.name) + '</strong> · ' + escapeAttribute(team.name) +
    '</p><p>Le projet est prêt à sortir. Tu peux encore corriger des bugs et améliorer la finition en prolongeant le développement.</p>' +
    '<div class="bt" style="justify-content:center"><button class="go" id="releaseNow" '+
    tip('Le studio ferme le chantier et livre cette version aux joueurs.')+'>Publier maintenant</button>' +
    '<button id="keepPolishing" '+tip('L’équipe retourne en salle de test. Le calendrier et le budget continuent quand le temps tourne.')+
    '>Continuer le polissage</button></div>');
  var dialog = $('#md');
  dialog.setAttribute('role','dialog');
  dialog.setAttribute('aria-modal','true');
  dialog.setAttribute('aria-labelledby','releaseDecisionTitle');
  if (project.hosted && !serverCapacity()) {
    $('#releaseNow').disabled = true;
    dialog.querySelector('.mb').insertAdjacentHTML('beforeend','<p class="ko">Loue de la capacité dans Serveurs pour publier ce jeu.</p>');
  }
  $('#releaseNow').onclick = function() {
    dialog.remove();
    if (team.proj === project) release(team);
  };
  $('#keepPolishing').onclick = function() {
    dialog.remove();
    if (team.proj === project) project.launchDecision = 'polish';
    var resume = project.resumeAfterDecision;
    delete project.resumeAfterDecision;
    captureProjectForm();
    g.currentTeam = g.teams.indexOf(team);
    projectDraft = curTeam().draftContext || null;
    tab = 0;
    setSpeed(resume);
    save();
  };
  dialog.addEventListener('keydown', function(event) {
    if (event.key !== 'Tab') return;
    event.preventDefault();
    ($('#releaseNow').disabled || document.activeElement===$('#releaseNow') ? $('#keepPolishing') : $('#releaseNow')).focus();
  });
  ($('#releaseNow').disabled ? $('#keepPolishing') : $('#releaseNow')).focus({preventScroll:true});
  save();
}

function countUp(n) {
  var i = 0;
  var e = $('#sc');
  var t = setInterval(function() {
    if (!e?.isConnected) return clearInterval(t);
    i = Math.min(n, i + Math.ceil(n/25));
    e.textContent = i;
    snd(300 + i*6, .05);
    if (i >= n) { clearInterval(t); e.style.color = 'var(--'+(n>=70?'ok':n<45?'ko':'wa')+')'; }
  }, 35);
}

var press = function(s) {
  return s>=85 ? '« Un chef-d\'œuvre. » (Presse spécialisée)'
  : s>=70 ? '« Un très bon jeu. » (Presse généraliste)'
  : s>=55 ? '« Correct, sans plus. » (Magazine spécialisé)'
  : s>=40 ? '« Des idées, mais il manque de finition. » (Webzine)'
  : '« Un désastre technique. » (Critique indépendant)';
};

function hire(i) {

function trainStaff(id) {

function upg() {

function loanPayment(principal) {
  return principal * LOAN_RATE / (1 - Math.pow(1 + LOAN_RATE, -LOAN_MONTHS));
}
function loan() {
