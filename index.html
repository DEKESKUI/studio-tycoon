}
function repay() {
  if (!g.loan) return;
  if (g.cash < g.loan.left) return toast('Trésorerie insuffisante pour rembourser.', 'ko');
  recordCash(-g.loan.left, 'Remboursement anticipé du prêt bancaire'); g.loan = null;
  L('Prêt remboursé par anticipation.'); render();
}
function updateIssue(game) {
  if (!isOnSale(game)) return 'Le jeu a quitté la vente. L’équipe a arrêté son suivi actif.';
  var firstYear = Math.min(...game.platforms.map(platform=>({PC:2001,Console:2006,Mobile:2007})[platform] || 2007));
  if (currentYear()<firstYear) return 'La diffusion régulière de mises à jour sur ces plateformes devient disponible en '+firstYear+'.';
  if (g.day-game.day<14) return 'Attends les premiers retours des joueurs avant de préparer une mise à jour.';
  if (g.day<(game.nextUpdate || 0)) return 'Le studio prépare son prochain cycle de maintenance.';
  if (g.cash<updateCost(game)) return 'La trésorerie ne permet pas de financer cette mise à jour.';
  return '';
}

function updateCost(game) {
  return [650,1850,10500,81000][game.sc]+Math.round((game.live?.players || 0)*.14);
}

function patch(i) {
  var game = g.rel[i];
  if (g.over || !game) return;
  var issue = updateIssue(game);
  if (issue) return toast(issue,'wa');
  var cost = updateCost(game);
  spend(cost,'Mise à jour de « '+game.name+' »');
  trackGameFinance(game,'cost',cost);
  var fixed = (game.bug || 0)*.32;
  game.bug = Math.max(0,(game.bug || 0)-fixed);
  game.score = Math.min(95,game.score+Math.min(5,Math.round(fixed*.25)));
  game.updateBoost = {day:g.day, hype:Math.min(12,6+Math.round(fixed*.2)),
    units:Math.min(game.u*.045,game.pot*.035), returns:game.u*.035};
  game.nextUpdate = g.day+60;
  game.patched = (game.patched || 0)+1;
  L('Les joueurs retrouvent « '+game.name+' » avec sa nouvelle mise à jour.','ok');
  save();
  render();
}

var eqCost = function(k) {
  var l = g.eq[k] || 0;
  return Math.round({desk:3000*(1+g.off)*(1+l*.4), pc:5000*Math.pow(l+1,1.6), rest:8000*(l+1), srv:10000*Math.pow(l+1,1.5)}[k]/50)*50;
};
var EQ = {
  desk: ['Bureaux supplémentaires','Deux places de travail supplémentaires',function(){ return 1+g.off*2; }],
  pc: ['Postes de travail puissants','Productivité +8 % par niveau',function(){ return 5; }],
  rest: ['Salle de repos','Le moral remonte plus vite',function(){ return 3; }],
  srv: ['Serveur de compilation','Bugs générés -10 % par niveau',function(){ return 3; }],
};
function buy(k) {
  if (!EQ[k]) return;
  var l = g.eq[k] || 0, c = eqCost(k);
  if (l >= EQ[k][2]()) return toast('Niveau maximum atteint pour cet équipement.', 'wa');
  if (g.cash < c) return toast('Trésorerie insuffisante (' + fmt(c) + ' requis).', 'ko');
  spend(c, 'Équipement : ' + EQ[k][0]); g.eq[k] = l + 1;
  jingle([523,659,784]);
  L(EQ[k][0]+' — niveau '+g.eq[k]+'.','ok');
  render();
}

function research(id) {
  var t = TECHS.find(function(x){ return x.id === id; });
  if (!t || g.techs.indexOf(id) >= 0) return;
  if (currentYear() < t.y) return toast('Disponible à partir de ' + t.y + '.','ko');
  if (g.cash < t.c) return toast('Trésorerie insuffisante (' + fmt(t.c) + ' requis).','ko');
  spend(t.c, 'Recherche : ' + t.n); g.techs.push(id);
  L('Recherche terminée : ' + t.n + '.','ok');
  jingle([440,554,659]);
  render();
}

function openEngineModal() {
  if (g.techs.length < 2) return toast('Recherchez d\'abord au moins deux technologies.', 'ko');
  var techList = g.techs.map(function(id){ return TECHS.find(function(t){ return t.id === id; }); }).filter(Boolean);
  var techHTML = techList.map(function(t) {
    return '<label class="feat-check"><input type="checkbox" value="'+t.id+'" checked onchange="updateEngModal()">'+
      fieldCaption(t.icon+' '+t.n,engineTechnologyTip(t))+'</label>';
  }).join('');
  modal(
    '<h3 style="border-left:0;padding:0;text-align:center;margin:0 0 20px">⚙️ Créer un moteur</h3>' +
    '<div class="g2">' +
      '<label>Nom du moteur<input id="engName" value="Moteur v'+(g.engines.length+1)+'"></label>' +
      '<label>Prix de vente ($)<input id="engPrice" type="number" min="0" step="500" value="5000" oninput="updateEngModal()"></label>' +
    '</div>' +
    '<div class="eng-slider-wrap">' +
      '<label style="display:flex;flex-direction:row;justify-content:space-between;align-items:center;text-transform:none;letter-spacing:0;font-size:13px">' +
        '<span>Redevance sur les revenus des studios utilisateurs</span><span id="engRoyaltyLabel" class="slider-value">10%</span>' +
      '</label>' +
      '<input id="engRoyalty" type="range" min="0" max="50" step="1" value="10" oninput="updateEngModal()">' +
    '</div>' +
    '<h4>Technologies incluses</h4>' +
    '<div class="feat-grid" id="engTechs">' + techHTML + '</div>' +
    '<div style="margin-top:18px;padding:12px;background:var(--panel-2);border-radius:4px;border:1px solid var(--border)">' +
      '<p style="margin:0"><strong>Coût de création :</strong> <span id="engCost">—</span></p>' +
      '<p style="margin:6px 0 0;font-size:13px" class="mu">Qualité perçue : <span id="engQuality">—</span></p>' +
    '</div>' +
    '<div class="bt" style="justify-content:flex-end;margin-top:20px">' +
      '<button onclick="closeModal()">Annuler</button>' +
      '<button class="go" onclick="confirmCreateEngine()">Créer le moteur</button>' +
    '</div>'
  , true);
  setTimeout(updateEngModal, 50);
}
function updateEngModal() {
  if (!$('#engRoyalty')) return;
  var royalty = +($('#engRoyalty').value) || 0;
  var price = +($('#engPrice').value) || 0;
  var checked = $$('#engTechs input:checked').length;
  $('#engRoyaltyLabel').textContent = royalty + '%';
  $('#engCost').textContent = fmt(engineCreationCost(checked));
  var quality = engineMarketAppeal(checked,0,price,royalty/100);
  var q = $('#engQuality');
  q.textContent = Math.round(quality) + ' (plus haut = plus attractif)';
  q.style.color = quality > 150 ? 'var(--jade)' : quality > 60 ? 'var(--gold)' : 'var(--rust)';
}
function confirmCreateEngine() {
  var name = $('#engName').value.trim() || 'Moteur sans nom';
  var price = Math.max(0, +($('#engPrice').value) || 0);
  var royalty = Math.min(0.5, Math.max(0, (+($('#engRoyalty').value) || 0) / 100));
  var techs = [];
  $$('#engTechs input:checked').forEach(function(el){ techs.push(el.value); });
  if (techs.length < 2) return toast('Sélectionnez au moins deux technologies.','ko');
  var cost = engineCreationCost(techs.length);
  if (g.cash < cost) return toast('Trésorerie insuffisante (' + fmt(cost) + ' requis).','ko');
  spend(cost, 'Création du moteur « ' + name + ' »');
  g.engines.push({
    id: 'eng-' + Date.now(), name: name, techs: techs.slice(), price: price, royalty: royalty,
    created: g.day, users: 0, totalUsers: 0, revenue: 0,
  });
  L('Moteur créé : ' + name + '.','ok');
  jingle([523,659,784,1047]);
  confetti();
  closeModal();
  render();
}
function buyStockEngine(id) {
  var e = STOCK_ENGINES.find(function(x){ return x.id === id; });
  if (!e || g.stockEngines.indexOf(id) >= 0) return;
  if (g.cash < e.fee) return toast('Trésorerie insuffisante (' + fmt(e.fee) + ' requis).','ko');
  spend(e.fee, 'Achat du moteur « ' + e.n + ' »'); g.stockEngines.push(id);
  L('Moteur acquis : ' + e.n + '.','ok');
  jingle([523,659]);
  render();
}

var FACTORY_TYPES = [
  {n:'Atelier local', cost:1500, cap:3000},
  {n:'Usine régionale', cost:12000, cap:20000},
  {n:'Usine internationale', cost:50000, cap:100000},
];
function contractFactory(idx) {
  var f = FACTORY_TYPES[idx];
  if (!f) return;
  if (g.cash < f.cost) return toast('Trésorerie insuffisante (' + fmt(f.cost) + ' requis).','ko');
  g.factories.push(Object.assign({}, f));
  L('Contrat signé : ' + f.n + ' (' + fmt(f.cost) + '/mois).','ok');
  render();
}
function cancelFactory(idx) {
  var f = g.factories[idx];
  if (!f) return;
  ask('Résilier le contrat avec ' + f.n + ' ?', function() {
    var position = g.factories.indexOf(f);
    if (position<0) return;
    g.factories.splice(position,1);
    L('Contrat résilié : ' + f.n + '.');
    render();
  });
}

// === GRAPHIQUES ===

function profitChart() {
  var h = '<div class="c"><h3>Rentabilité par jeu</h3>';
  if (!g.rel.length) return h + '<p class="mu">La courbe apparaît à la sortie du premier jeu.</p></div>';
  var selected = clamp(0,g.rel.length-1,g.graphGame || 0);
  var game = g.rel[selected];
  var balance = -game.launchCost;
  var amounts = [balance];
  var elapsed = Math.max(0,Math.ceil((g.day-game.day)/7));
  var lastRecordedWeek = Math.max(-1,...Object.keys(game.financeWeeks).map(Number));
  var weeks = Math.max(Math.min(elapsed,172),lastRecordedWeek+1);
  for (var w = 0; w < weeks; w++) {
    var entry = game.financeWeeks[w];
    if (entry) balance += entry.rev-entry.cost;
    amounts.push(balance);
  }
  var W = 640, H = 230, L = 72, Rm = 12, T = 18, B = 32;
  var min = Math.min(-1,...amounts), max = Math.max(0,...amounts);
  var x = i => L + i/Math.max(1,weeks) * (W-L-Rm);
  var y = value => T + (max-value)/(max-min) * (H-T-B);
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Résultat cumulé du jeu depuis sa sortie" style="width:100%;height:auto;min-width:360px">';
  var ticks = [0];
  for (var value of [min,max,min/2,max/2]) {
    if (ticks.every(other => Math.abs(y(value)-y(other)) >= 17)) ticks.push(value);
  }
  ticks.forEach(function(value) {
    svg += '<line x1="'+L+'" x2="'+(W-Rm)+'" y1="'+y(value)+'" y2="'+y(value)+'" stroke="'+(value===0?'var(--gold)':'var(--border-strong)')+'" stroke-dasharray="'+(value===0?'5 3':'2 4')+'"/>' +
      '<text x="'+(L-8)+'" y="'+(y(value)+4)+'" text-anchor="end" fill="var(--text-mute)" font-size="11">'+
      (value<0?'−':'')+fmtK(Math.abs(value))+'</text>';
  });
  svg += '<polyline fill="none" stroke="var(--jade)" stroke-width="2.5" points="'+amounts.map((amount,i) => x(i)+','+y(amount)).join(' ')+'"/>';
  amounts.forEach(function(amount,i) {
    svg += '<circle cx="'+x(i)+'" cy="'+y(amount)+'" r="'+(i===0||i===weeks?4:2.5)+'" fill="'+(amount<0?'var(--rust)':'var(--jade)')+'"><title>'+
      (i===0?'À la sortie':'Semaine '+i)+' : '+signedMoney(amount)+'</title></circle>';
  });
  svg += '<text x="'+L+'" y="'+(H-7)+'" fill="var(--text-mute)" font-size="11">Sortie</text>';
  if (weeks) svg += '<text x="'+x(weeks)+'" y="'+(H-7)+'" text-anchor="end" fill="var(--text-mute)" font-size="11">Semaine '+weeks+'</text>';
  svg += '</svg>';
  var result = game.rev-game.cost;
  return h + '<label>'+fieldCaption('Jeu','Choisis un jeu pour consulter son résultat et son éventuel relevé de stock.')+
    '<select onchange="g.graphGame=+this.value;render()">'+g.rel.map((r,i) =>
    '<option value="'+i+'" '+(i===selected?'selected':'')+'>'+escapeAttribute(r.name)+'</option>').join('')+'</select></label>' +
    '<div class="chart">'+svg+'</div><p class="mu">Budget à la sortie <strong>'+signedMoney(-game.launchCost)+'</strong> · Recettes nettes <strong>'+
    fmt(game.rev)+'</strong> · Résultat actuel <strong class="'+(result>=0?'ok':'ko')+'">'+signedMoney(result)+'</strong></p>' +
    '<p class="mu">Le seuil de rentabilité est à zéro. Correctifs, extensions et support comptent dans la semaine de la dépense.' +
    (game.financeEstimated?' La chronologie avant la mise à jour est estimée à partir des ventes conservées.':'') + '</p></div>';
}

function signedMoney(amount) {
  return (amount < 0 ? '−' : '') + fmt(Math.abs(amount));
}

function salesChart() {
  var h = '<div class="c"><h3>📊 Ventes hebdomadaires</h3>';
  if (!g.rel.length) return h + '<p class="mu">Apparaîtra après la sortie du premier jeu.</p></div>';
  var wn = Math.floor(g.day/7), N = Math.min(26, wn+1), w0 = wn-N+1;
  var cols = ['#d4a145','#5b8fc4','#5da478','#e6b558','#a06bbd','#6bb3c9'];
  var val = (game, week) => game.h?.[week - Math.floor(game.day/7)] || 0;
  var mx = 1, total = 0;
  for (var i = 0; i < N; i++) { var t = 0; for (var j = 0; j < g.rel.length; j++) t += val(g.rel[j], w0+i); total += t; if (t > mx) mx = t; }
  var sh = function(n){ return n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? Math.round(n/1e3)+'k' : Math.round(n); };
  var W = 640, H = 230, L = 56, B = 26, T = 10, pw = W-L-8, ph = H-B-T, bw = pw/N;
  var sv = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;min-width:420px">';
  for (var k = 0; k <= 2; k++) {
    var y = T + ph - ph*k/2;
    sv += '<line x1="'+L+'" x2="'+(W-8)+'" y1="'+y+'" y2="'+y+'" stroke="var(--border-strong)" stroke-dasharray="2 4"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" font-family="var(--font-mono)" fill="var(--text-mute)">'+sh(mx*k/2)+'</text>';
  }
  for (var i2 = 0; i2 < N; i2++) {
    var y2 = T + ph;
    g.rel.forEach(function(r, j2) {
      var v = val(r,w0+i2);
      if (v <= 0) return;
      var hh = Math.max(1, v/mx*ph);
      y2 -= hh;
      sv += '<rect x="'+(L+i2*bw+1)+'" y="'+y2+'" width="'+Math.max(1,bw-2)+'" height="'+hh+'" fill="'+cols[(r.col||j2)%6]+'"><title>'+r.name+' : '+(nb(v)+' ventes')+'</title></rect>';
    });
  }
  [0,Math.floor((N-1)/2),N-1].forEach(function(i3,k2) {
    sv += '<text x="'+(L+i3*bw+bw/2)+'" y="'+(H-8)+'" text-anchor="'+(k2===0?'start':k2===2?'end':'middle')+'" font-size="11" font-family="var(--font-mono)" fill="var(--text-mute)">'+new Date(START_YEAR,0,1+(w0+i3)*7).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+'</text>';
  });
  sv += '</svg>';
  var lg = g.rel.map(function(r,j3){ return '<span style="margin-right:14px;white-space:nowrap"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+cols[(r.col||j3)%6]+';vertical-align:0"></i> '+r.name+'</span>'; }).join('');
  return h + '<div class="chart">'+sv+'</div><p>'+lg+'</p><p class="mu">Total sur '+N+' semaines : '+nb(total)+' ventes.</p></div>';
}

function revenueChart() {
  var h = '<div class="c"><h3>💵 Recettes mensuelles</h3>';
  if (!g.revenueHistory || g.revenueHistory.length < 2) return h + '<p class="mu">La courbe apparaîtra après quelques mois d\'activité.</p></div>';
  var data = g.revenueHistory.slice(-24);
  var W = 640, H = 220, L = 70, Rm = 10, T = 14, B = 30;
  var pw = W - L - Rm, ph = H - B - T;
  var maxT = Math.max.apply(null, data.map(function(d){ return d.revenue || 0; }).concat([1000]));
  var bw = pw / data.length;
  var sv = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;min-width:420px">';
  for (var i = 0; i <= 4; i++) {
    var y = T + ph - (i/4)*ph;
    var v = maxT * (i/4);
    sv += '<line x1="'+L+'" x2="'+(W-Rm)+'" y1="'+y+'" y2="'+y+'" stroke="var(--border-strong)" stroke-dasharray="2 4"/>';
    sv += '<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" font-family="var(--font-mono)" fill="var(--text-mute)">'+fmtK(v)+'</text>';
  }
  data.forEach(function(d,i2) {
    var x = L + i2 * bw + 2;
    var hh = ((d.revenue||0) / maxT) * ph;
    var y2 = T + ph - hh;
    sv += '<rect x="'+x+'" y="'+y2+'" width="'+(bw-4)+'" height="'+Math.max(1,hh)+'" fill="var(--gold)" opacity=".85"><title>'+d.label+' : '+fmt(d.revenue||0)+'</title></rect>';
  });
  [0, Math.floor(data.length/2), data.length-1].forEach(function(i3,k2) {
    if (!data[i3]) return;
    var x2 = L + i3 * bw + bw/2;
    sv += '<text x="'+x2+'" y="'+(H-10)+'" text-anchor="'+(k2===0?'start':k2===2?'end':'middle')+'" font-size="11" font-family="var(--font-mono)" fill="var(--text-mute)">'+data[i3].label+'</text>';
  });
  sv += '</svg>';
  var avg = data.reduce(function(a,d){ return a+(d.revenue||0); }, 0) / data.length;
  return h + '<div class="chart">'+sv+'</div><p class="mu">Moyenne mensuelle : <strong style="color:var(--gold);font-family:var(--font-mono)">'+fmt(avg)+'</strong> · Cumul : <strong style="color:var(--text);font-family:var(--font-mono)">'+fmt(g.totalRevenue)+'</strong></p></div>';
}

function compareChart() {
  var h = '<div class="c"><h3>⚖️ Comparaison des lancements</h3>';
  if (g.rel.length < 2) return h + '<p class="mu">Sortez au moins deux jeux pour activer la comparaison.</p></div>';
  var games = g.rel.slice(0, 6);
  var N = 12;
  var cols = ['#d4a145','#5b8fc4','#5da478','#e6b558','#a06bbd','#6bb3c9'];
  var mx = 1;
  for (var gi = 0; gi < games.length; gi++) for (var ii = 0; ii < N; ii++) { var v = (games[gi].h && games[gi].h[ii]) || 0; if (v > mx) mx = v; }
  var W = 640, H = 260, L = 60, B = 30, T = 12, Rm = 10;
  var pw = W - L - Rm, ph = H - B - T, bw = pw / N;
  var sv = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;min-width:420px">';
  for (var k = 0; k <= 3; k++) {
    var y = T + ph - ph*k/3;
    sv += '<line x1="'+L+'" x2="'+(W-Rm)+'" y1="'+y+'" y2="'+y+'" stroke="var(--border-strong)" stroke-dasharray="2 4"/>';
    sv += '<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" font-family="var(--font-mono)" fill="var(--text-mute)">'+Math.round(mx*k/3).toLocaleString('en-US')+'</text>';
  }
  games.forEach(function(r, j) {
    var d = '';
    for (var i2 = 0; i2 < N; i2++) {
      if (!r.h || i2 >= r.h.length) break;
      var x = L + i2*bw + bw/2, y2 = T + ph - ((r.h[i2]||0)/mx)*ph;
      d += (i2===0?'M':'L') + x + ',' + y2 + ' ';
    }
    if (!d) return;
    sv += '<path d="'+d+'" fill="none" stroke="'+cols[j%6]+'" stroke-width="2.5" stroke-linejoin="round"/>';
  });
  sv += '<text x="'+L+'" y="'+(H-8)+'" font-size="11" font-family="var(--font-mono)" fill="var(--text-mute)">Semaine 1</text>';
  sv += '<text x="'+(W-Rm)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" font-family="var(--font-mono)" fill="var(--text-mute)">Semaine '+N+'</text></svg>';
  var legend = games.map(function(r,j2){ return '<span style="margin-right:14px;white-space:nowrap"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+cols[j2%6]+'"></i>'+r.name+' (note '+r.score+')</span>'; }).join('');
  return h + '<div class="chart">'+sv+'</div><p>'+legend+'</p></div>';
}

function scoreDistributionChart() {
  var h = '<div class="c"><h3>⭐ Distribution des notes</h3>';
  if (!g.rel.length) return h + '<p class="mu">Aucun jeu sorti.</p></div>';
  var buckets = Array(10).fill(0);
  g.rel.forEach(function(r){ buckets[Math.min(9, Math.floor(r.score/10))]++; });
  var mx = Math.max.apply(null, buckets.concat([1]));
  var W = 640, H = 200, L = 40, B = 26, T = 10, Rm = 10;
  var pw = W - L - Rm, ph = H - B - T, bw = pw / 10;
  var sv = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;min-width:420px">';
  buckets.forEach(function(v,i) {
    var hh = (v/mx)*ph, x = L + i*bw + 4, y = T + ph - hh;
    var col = i<4 ? 'var(--rust)' : i<7 ? 'var(--warn)' : 'var(--jade)';
    sv += '<rect x="'+x+'" y="'+y+'" width="'+(bw-8)+'" height="'+Math.max(1,hh)+'" fill="'+col+'" opacity=".85"><title>'+(i*10)+'-'+(i*10+9)+' : '+v+' jeu(x)</title></rect>';
    sv += '<text x="'+(x+(bw-8)/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" font-family="var(--font-mono)" fill="var(--text-mute)">'+(i*10)+'</text>';
  });
  sv += '</svg>';
  return h + '<div class="chart">'+sv+'</div></div>';
}

function platformShareChart() {
  var h = '<div class="c"><h3>🖥️ Répartition par plateforme</h3>';
  if (!g.rel.length) return h + '<p class="mu">Aucune donnée.</p></div>';
  var byPlat = {};
  g.rel.forEach(function(r) {
    var plats = r.platforms || [r.plat];
    plats.forEach(function(pl){ byPlat[pl] = (byPlat[pl]||0) + (r.rev / plats.length); });
  });
  var total = Object.values(byPlat).reduce(function(a,b){ return a+b; }, 0);
  if (!total) return h + '<p class="mu">Aucune recette enregistrée.</p></div>';
  var cols = {'PC':'#d4a145','Console':'#5b8fc4','Mobile':'#5da478'};
  var W = 640, H = 120;
  var sv = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;min-width:420px">';
  var x = 0;
  Object.keys(byPlat).forEach(function(p) {
    var v = byPlat[p];
    var w = (v/total)*W;
    sv += '<rect x="'+x+'" y="20" width="'+w+'" height="40" fill="'+(cols[p]||'#888')+'"><title>'+p+' : '+fmt(v)+'</title></rect>';
    sv += '<text x="'+(x+w/2)+'" y="90" text-anchor="middle" font-size="12" font-family="var(--font-mono)" fill="var(--text)">'+p+' — '+Math.round(v/total*100)+' %</text>';
    x += w;
  });
  sv += '</svg>';
  return h + '<div class="chart">'+sv+'</div></div>';
}

function devTimeChart() {
  var h = '<div class="c"><h3>⏱️ Durée de développement</h3>';
  if (!g.rel.length) return h + '<p class="mu">Aucun jeu sorti.</p></div>';
  var games = g.rel.filter(function(r){ return r.devDays; }).slice(0, 12);
  if (!games.length) return h + '<p class="mu">Durées indisponibles.</p></div>';
  var mx = Math.max.apply(null, games.map(function(r){ return r.devDays; }).concat([1]));
  var W = 640, H = 60 + games.length * 26, L = 160, Rm = 60, T = 10;
  var pw = W - L - Rm;
  var sv = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;min-width:420px">';
  games.forEach(function(r, i) {
    var y = T + i * 26;
    var w = (r.devDays / mx) * pw;
    var col = r.score >= 75 ? 'var(--jade)' : r.score >= 55 ? 'var(--gold)' : 'var(--rust)';
    var name = r.name.length > 20 ? r.name.slice(0,18)+'…' : r.name;
    sv += '<text x="'+(L-8)+'" y="'+(y+15)+'" text-anchor="end" font-size="11" font-family="var(--font-mono)" fill="var(--text)">'+name+'</text>';
    sv += '<rect x="'+L+'" y="'+(y+4)+'" width="'+Math.max(2,w)+'" height="16" fill="'+col+'" opacity=".85"><title>'+r.name+' : '+Math.round(r.devDays/30)+' mois (note '+r.score+')</title></rect>';
    sv += '<text x="'+(L+w+6)+'" y="'+(y+16)+'" font-size="11" font-family="var(--font-mono)" fill="var(--text-mute)">'+Math.round(r.devDays/30)+' mois</text>';
  });
  sv += '</svg>';
  return h + '<div class="chart">'+sv+'</div></div>';
}

        '<div ' + tip('Compétences du candidat : ' + Math.round(s.skill) + '.') + '><div class="bar"><i style="width:' + Math.min(100,s.skill/100) + '%"></i></div><small class="mu">Compétences ' + Math.round(s.skill) + '</small></div>' +

function pMarket() {
  var year = currentYear();
  var h = '';


  var activeGenres = Object.keys(GEN).filter(k => genreAvailable(k,year))
    .map(k => ({name:k,demand:demandFor(k),previous:genreAvailable(k,year-1) ? getGenreDemand(k,year-1) : null}))
    .sort((a,b) => b.demand-a.demand);
  var anchor = marketYears.findLast(y => y <= year);
  h += '<div class="c"><h3>Tendances du marché en ' + year + '</h3>' +
    '<p class="mu">' + (year <= 2026
      ? 'La demande évolue chaque année sur une chronologie identique dans toutes les parties.'
      : 'Les indices conservent leur niveau de 2026 au-delà de la période historique simulée.') + '</p>' +
    '<p><strong>' + anchor + '</strong> · ' + MARKET_MILESTONES[anchor] + '</p>' +
    activeGenres.map(function(genre) {
      var change = genre.previous === null ? '' : genre.demand-genre.previous;
      var delta = genre.previous === null ? 'Nouveau' :
        (Math.abs(change)<.005 ? 'Stable' : change>0?'En hausse':'En baisse');
      return '<div class="genre-row" ' + tip('Demande par rapport à l’année précédente : ' + delta) + '>' +
        '<span>' + genre.name + '</span><div class="bar"><i style="width:' +
        100*genre.demand/activeGenres[0].demand+'%"></i></div><span class="genre-value">×'+genre.demand.toFixed(2)+
        '</span><span class="genre-boost '+(change>0?'ok':change<0?'ko':'mu')+'">'+delta+'</span></div>';
    }).join('') + '</div>';

  h += '<div class="c"><h3>🔮 Technologies accessibles en ' + year + '</h3>';
  var avail = TECHS.filter(function(t){ return year >= t.y; });
  var notResearched = avail.filter(function(t){ return g.techs.indexOf(t.id) < 0; }).slice(-6).reverse();
  if (notResearched.length === 0) {
    h += '<p class="mu">Toutes les technologies disponibles ont déjà été recherchées.</p>';
  } else {
    h += '<p class="mu">Technologies pas encore recherchées que vous pouvez débloquer dès maintenant.</p>' +
      '<div class="feat-grid">' + notResearched.map(function(t) {
        return '<div class="feat-check" style="cursor:default" ' + tip(engineTechnologyTip(t)) + '><span>' + t.icon + ' ' + t.n + '<small>' + t.desc + ' — ' + fmt(t.c) + '</small></span></div>';
      }).join('') + '</div>';
  }
  h += '</div>';

  h += '<div class="c"><h3>🌍 Marché mondial — Traductions</h3>' +
    '<p class="mu">Chaque langue couvre une part du marché mondial. Cumulez les traductions pour augmenter vos ventes à l\'international.</p>' +
    '<div class="tw"><table><thead><tr><th>Langue</th><th>Part de marché</th><th>Disponible depuis</th><th>Coût indicatif (jeu AA)</th></tr></thead><tbody>' +
    TRANSLATIONS.map(function(t) {
      var cost = translationCost(t, 2);
      return '<tr><td aria-label="'+t.n+'" '+tip(t.n,'Le drapeau repère cette langue dans la distribution internationale.')+'>' + languageFlag(t.id) +
        '</td><td>' + Math.round(t.share * 100) + ' %</td><td>' + t.y + '</td><td>' +
        (year >= t.y ? fmt(cost) : '<span class="mu">disponible en ' + t.y + '</span>') +
        '</td></tr>';
    }).join('') +
    '</tbody></table></div></div>';

  return h;
}

function pResearch() {

  });

      h += '<div class="feat-check" style="cursor:' + (!own && canBuy ? 'pointer' : 'default') + ';' + (!own && !avail ? 'opacity:.55' : '') + '" ' + tip({...engineTechnologyTip(t),rule:engineTechnologyTip(t).rule+' '+tipTxt}) + (!own && canBuy ? ' onclick="research(\'' + t.id + '\')"' : '') + '>' +

var dailyCurrency = new Intl.NumberFormat('en-US', {
  style:'currency', currency:'USD', minimumFractionDigits:0, maximumFractionDigits:2,
});
var dailyFinanceMarkup = '';
function dailyAmount(entries, total, kind) {
  var amounts = Object.entries(entries || {});
  if (!amounts.length) return '<td class="mu">—</td>';
  var detail = amounts.map(([reason, amount]) => reason + ' : ' + dailyCurrency.format(amount)).join('\n');
  var shownTotal = dailyCurrency.format(total);
  return '<td class="' + kind + '"><span class="amount" tabindex="0" aria-label="' +
    escapeAttribute(shownTotal + ' — ' + detail) + '" ' + tip(detail) + '>' + shownTotal + '</span></td>';
}

function dailyFinance() {
  // Keep a day readable while the simulation advances in the background.
  if ($('.daily-fin .amount:is(:hover,:focus-visible)')) return dailyFinanceMarkup;
  var dates = new Set([g.day, ...Object.keys(g.dailyFin).map(Number)]);
  var rows = Array.from(dates).sort((a,b) => b-a).map(function(day) {
    var entries = g.dailyFin[day] || {};
    var date = new Date(START_YEAR, 0, 1 + day).toLocaleDateString('fr-FR');
    var revenue = sum(entries.rev || {});
    var expenses = sum(entries.cost || {});
    var balance = revenue-expenses;
    return '<tr><td>' + date + '</td>' + dailyAmount(entries.rev,revenue,'ok') + dailyAmount(entries.cost,expenses,'ko') +
      '<td class="'+(balance>=0?'ok':'ko')+'" '+tip('Le solde est la différence entre les recettes et les dépenses de cette journée.')+
      '>'+dailyCurrency.format(balance)+'</td></tr>';
  }).join('');
  var previous = g.dailyFinStart > 0 ? ' Le détail est disponible à partir du ' +
    new Date(START_YEAR, 0, 1 + g.dailyFinStart).toLocaleDateString('fr-FR') + '.' : '';
  dailyFinanceMarkup = '<div class="c daily-fin"><h3>Opérations par jour</h3><p class="mu">Les 90 derniers jours. Survolez un montant pour voir son détail.' +
    previous + '</p><table><thead><tr><th>Jour</th><th>Recettes</th><th>Dépenses</th><th>Solde</th></tr></thead><tbody>' +
    rows + '</tbody></table></div>';
  return dailyFinanceMarkup;
}

function pEquip() {

      : '<p class="mu">Vous êtes au plus haut niveau de locaux.</p>') +

    var maxed = lvl >= max;

    var btnTip = maxed ? 'Niveau maximum atteint.' : disabled ? 'Trésorerie insuffisante (' + fmt(cost) + ' requis).' : 'Améliorer cet équipement.';
    var equipmentEffects = [['ok',{desk:'+2 places de travail',pc:'+8 % de productivité',rest:'Récupération du moral accélérée',srv:'−10 % de bugs générés'}[k]],['ko','−'+fmt(cost)+' de trésorerie']];

      '<strong>' + EQ[k][0] + '</strong>' +

    '</div>';

  return h;

function stockChart(history, label) {
  var values = Object.entries(history || {}).filter(([,entry])=>entry.filled || entry.lost || entry.capacity)
    .sort((a,b)=>Number(a[0])-Number(b[0])).slice(-12);
  if (!values.length) return '<p class="mu">Les relevés apparaissent dès que des copies physiques sont demandées.</p>';
  var max = Math.max(1,...values.map(([,item])=>Math.max(item.filled+item.lost,item.capacity || 0)));
  var width = 540, height = 140, plot = 110, baseline = 118;
  var barSpace = (width-42)/values.length;
  var svg = '<svg viewBox="0 0 '+width+' '+height+'" role="img" aria-label="'+escapeAttribute(label)+'" style="width:100%;max-height:180px">';
  var capacities = [];
  values.forEach(function([week,entry],i) {
    var x = 24+i*barSpace, shipped = entry.filled/max*plot, missed = entry.lost/max*plot;
    var date = new Date(START_YEAR,0,1+Number(week)*7).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    var desc = 'Semaine du '+date+' : '+nb(entry.filled)+' copies livrées. '+nb(entry.lost)+' commandes perdues.'+
      (entry.capacity!==undefined ? ' L’atelier pouvait livrer '+nb(entry.capacity)+' copies pendant les jours écoulés de cette semaine.' : '');
    svg += '<g '+tip(desc)+'><rect x="'+x+'" y="'+(baseline-shipped)+'" width="'+Math.max(4,barSpace-9)+
      '" height="'+shipped+'" fill="var(--jade)"/><rect x="'+x+'" y="'+(baseline-shipped-missed)+'" width="'+Math.max(4,barSpace-9)+
      '" height="'+missed+'" fill="var(--rust)"/></g>';
    if (entry.capacity!==undefined) capacities.push((x+barSpace/2)+','+(baseline-entry.capacity/max*plot));
    if (i===0 || i===values.length-1) svg += '<text x="'+x+'" y="135" fill="var(--text-mute)" font-size="10">'+date+'</text>';
  });
  if (capacities.length>1) svg += '<polyline points="'+capacities.join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="4 3"/>';
  return '<div class="chart">'+svg+'</svg></div><p class="mu"><span class="ok">Livrées</span> · <span class="ko">Commandes perdues</span>'+
    (capacities.length ? ' · <span class="wa">Capacité disponible</span>' : '')+'</p>';
}

      return '<button onclick="contractFactory('+index+')" '+(g.cash<factory.cost?'disabled ':'')+

    }).join('')+'</div>'+

function openGameGraph(index) {
  if (!g.rel[index]) return;
  g.graphGame = index;
  selectTab(8);
  if ($('#mn').getBoundingClientRect().top < 0) window.scrollTo(0,0);
}


function miniWeeklySales(game) {
  var now = Math.floor(g.day/7);
  var first = Math.floor(game.day/7);
  var weeks = Array.from({length:Math.min(9,now-first+1)},(_,i)=>Math.max(first,now-8)+i);
  if (!weeks.length) return '';
  var counts = weeks.map(week=>game.h?.[week-first] || 0);
  var max = Math.max(1,...counts);
  return '<svg class="rail-chart" viewBox="0 0 160 32" preserveAspectRatio="none" role="img" aria-label="Ventes par semaine" '+
    tip('Chaque barre raconte combien d’exemplaires sont partis cette semaine. Les fêtes et les relances peuvent réveiller les ventes.')+'>'+
    counts.map((value,i)=>'<rect x="'+(i*17+3)+'" y="'+(30-value/max*27)+'" width="13" height="'+Math.max(1,value/max*27)+
      '" fill="var(--gold)"><title>'+nb(value)+' exemplaires vendus.</title></rect>').join('')+'</svg>';
}


function gameHypeMeter(game) {
  var hype = gameHype(game);
  return '<div class="market-hype" '+tip('Le public continue de parler du jeu après sa sortie.', 'La hype soutient les ventes tant que le jeu est encore au catalogue. Même une relance ne peut pas annuler le vieillissement du jeu.', [['ok',hype+' / 150 de hype']])+
    '><span>Hype <strong>'+hype+'</strong></span><div class="bar" role="progressbar" aria-label="Hype" aria-valuemin="0" aria-valuemax="150" aria-valuenow="'+hype+'"><i style="width:'+(100*hype/150)+'%"></i></div></div>';
}

function renderMarketRail() {
  var active = g.rel.map((game,index)=>({game:game,index:index})).filter(entry=>isOnSale(entry.game))
    .sort((a,b)=>b.game.day-a.game.day || a.index-b.index);
  var markup = '<h3 class="rail-title">Jeux en vente <span class="mu">· '+active.length+'</span></h3>';
  markup += active.length ? '<div class="market-list">'+active.map(function(entry) {
    var game = entry.game;
    var recorded = Array.isArray(game.recentSales);
    var thisWeek = recorded ? game.recentSales.reduce((total,sale) => total+sale.units,0)
      : game.h?.[Math.floor(g.day/7)-Math.floor(game.day/7)] || 0;
    var promo = promotionActive(game);
    var relaunch = game.relaunch && g.day-game.relaunch.day < 30;
    var updated = game.updateBoost && g.day-game.updateBoost.day<30;
    var shortage = (game.recentSales || []).reduce((total,sale)=>total+(sale.lost || 0),0);
    var result = (game.rev || 0)-(game.cost || 0);
    return '<article class="market-tile" id="tile-'+entry.index+'"><button onclick="openGameGraph('+entry.index+')" '+
      tip('Ouvre les relevés du jeu pour examiner les ventes et le résultat cumulé.')+
      ' aria-label="Rentabilité de '+escapeAttribute(game.name)+'">'+escapeAttribute(game.name)+'</button>'+
      '<p>'+game.platforms.join(' / ')+' · '+game.score+'/100</p>'+
      '<p><strong>'+nb(thisWeek)+'</strong> '+(recorded?'ventes sur 7 j':'ventes cette semaine')+' · '+nb(game.u)+' au total</p>'+
      miniWeeklySales(game)+gameHypeMeter(game)+'<p '+tip('Le solde démarre au coût de production. Les recettes et les frais réels l’actualisent au fil des jours.')+
      '>Résultat actuel <strong class="'+(result>=0?'ok':'ko')+'">'+signedMoney(result)+'</strong></p>'+
      (shortage ? '<p class="ko"><button class="stock-link" onclick="openDistribution()" '+tip(STOCK_HINT)+'>Rupture de stock · '+nb(shortage)+' commandes</button></p>' : '')+
      (promo || relaunch || updated ? '<p class="wa">'+[promo?'Promo −20 %':'',relaunch?'Relance DLC':'',updated?'Mise à jour récente':''].filter(Boolean).join(' · ')+'</p>' : '')+
      '</article>';
  }).join('')+'</div>' : '<p class="mu">Aucun titre en vente.</p>';
  updateRegion($('#marketRail'), markup);
}

    g.rel.map(function(r,i) {

        '<td>' + new Date(START_YEAR,0,1+r.day).toLocaleDateString('fr-FR',{year:'numeric',month:'short'}) + '</td>' +

        '<td>' + nb(r.u) + '</td>' +
        '<td>' + fmt(r.rev) + '</td>' +
        '<td>' + fmt(r.cost) + '</td>' +
        '<td class="' + (r.rev>=r.cost?'ok':'ko') + '">' + signedMoney(r.rev-r.cost) + '</td>' +
        '<td>' + ((r.translations||[]).length+1) + '</td>' +
        '<td>' + (r.dlcs||0) + (r.addons?.length ? '<details><summary>Détails</summary>' +
          r.addons.map(addon => '<p>'+escapeAttribute(addon.name)+' · '+addon.score+'/100 · '+nb(addon.u)+' ventes · '+fmt(addon.rev)+'</p>').join('') + '</details>' : '') + '</td>' +
        '<td>' +
          '<button onclick="patch(' + i + ')" ' + (updateBlocked?'disabled ':'') + tip(patchReason) + '>Mise à jour</button> ' +
          '<button onclick="openFollowUp(' + i + ',\'dlc\')" ' + (expansionIssue?'disabled ':'') + tip(expansionIssue || 'Développer du contenu pour le jeu de base.') + '>Créer un DLC</button> ' +
          '<button onclick="openReleasedCampaign('+i+')" '+(campaignIssue?'disabled ':'')+
            tip('Le studio peut rappeler ce jeu aux joueurs.','La publicité augmente temporairement la hype. Les jeux récents réagissent davantage aux campagnes.'+(campaignIssue?' '+campaignIssue:''))+
            '>Publicité</button> '+
          '<button onclick="startPromotion(' + i + ')" ' + (promoIssue?'disabled ':'') + tip('Le jeu rejoint les offres spéciales.',promoIssue || 'Le prix réduit reste en vigueur pendant 14 jours.',[['ok','Demande accrue'],['ko','−20 % sur le prix de vente']]) +

        '</td>' +
      '</tr>';
    }).join('') +
    '</tbody></table></div></div>';
  return h;
}

function pPalmares() {
  var h = '<div class="c"><h3>🏆 Succès</h3>';
  if (!g.rel.length) {
    return h + '<p class="mu">Tes premiers succès apparaîtront après la sortie d’un jeu.</p></div>';
  }

  var bestScore = g.rel.slice().sort(function(a,b){ return b.score - a.score; })[0];
  var bestRev = g.rel.slice().sort(function(a,b){ return b.rev - a.rev; })[0];
  var bestUnits = g.rel.slice().sort(function(a,b){ return b.u - a.u; })[0];
  var totalGames = g.rel.length;
  var avgScore = g.rel.reduce(function(a,r){ return a + r.score; }, 0) / totalGames;
  var totalUnits = g.rel.reduce(function(a,r){ return a + r.u; }, 0);

  h += '</div><div class="c"><h3>📊 Records</h3><div class="g2">' +
    '<div class="feat-check" style="cursor:default;flex-direction:column;align-items:flex-start;padding:14px" ' + tip('Meilleure note presse obtenue sur un jeu.') + '>' +
      '<small class="mu">Meilleure note presse</small>' +
      '<strong style="color:var(--gold);font-size:22px">' + bestScore.score + '/100</strong>' +
      '<span style="color:var(--text)">' + bestScore.name + '</span>' +
    '</div>' +
    '<div class="feat-check" style="cursor:default;flex-direction:column;align-items:flex-start;padding:14px" ' + tip('Jeu qui a généré le plus de revenus.') + '>' +
      '<small class="mu">Plus gros revenus</small>' +
      '<strong style="color:var(--jade);font-size:22px">' + fmt(bestRev.rev) + '</strong>' +
      '<span style="color:var(--text)">' + bestRev.name + '</span>' +
    '</div>' +
    '<div class="feat-check" style="cursor:default;flex-direction:column;align-items:flex-start;padding:14px" ' + tip('Jeu qui s\'est le plus vendu en unités.') + '>' +
      '<small class="mu">Jeu le plus vendu</small>' +
      '<strong style="color:var(--gold);font-size:22px">' + nb(bestUnits.u) + ' unités</strong>' +
      '<span style="color:var(--text)">' + bestUnits.name + '</span>' +
    '</div>' +
    '<div class="feat-check" style="cursor:default;flex-direction:column;align-items:flex-start;padding:14px" ' + tip('Nombre total de jeux sortis et note moyenne.') + '>' +
      '<small class="mu">Jeux sortis</small>' +
      '<strong style="font-size:22px">' + totalGames + '</strong>' +
      '<span class="mu">Note moyenne : ' + avgScore.toFixed(1) + '</span>' +
    '</div>' +
    '<div class="feat-check" style="cursor:default;flex-direction:column;align-items:flex-start;padding:14px" ' + tip('Total d\'unités vendues toutes plateformes confondues.') + '>' +
      '<small class="mu">Unités totales</small>' +
      '<strong style="font-size:22px">' + nb(totalUnits) + '</strong>' +
      '<span class="mu">Toutes plateformes</span>' +
    '</div>' +
    '<div class="feat-check" style="cursor:default;flex-direction:column;align-items:flex-start;padding:14px" ' + tip('Revenus cumulés depuis le début de la partie.') + '>' +
      '<small class="mu">Revenus cumulés</small>' +
      '<strong style="color:var(--gold);font-size:22px">' + fmt(g.totalRevenue) + '</strong>' +
      '<span class="mu">Depuis le début</span>' +
    '</div>' +
  '</div></div>';

  var topScore = g.rel.slice().sort(function(a,b){ return b.score - a.score; }).slice(0, 5);
  h += '<div class="c"><h3>⭐ Top 5 — Meilleures notes</h3><div class="tw"><table><thead><tr><th>#</th><th>Jeu</th><th>Note</th><th>Genre</th><th>Sortie</th><th>Revenus</th></tr></thead><tbody>';
  topScore.forEach(function(r,i) {
    var medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'' + (i+1);
    h += '<tr><td>' + medal + '</td><td><strong>' + r.name + '</strong></td><td class="ok">' + r.score + '</td><td>' + r.genre + '</td><td>' + new Date(START_YEAR,0,1+r.day).toLocaleDateString('fr-FR',{year:'numeric',month:'short'}) + '</td><td>' + fmt(r.rev) + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  var topRev = g.rel.slice().sort(function(a,b){ return b.rev - a.rev; }).slice(0, 5);
  h += '<div class="c"><h3>💵 Top 5 — Plus gros revenus</h3><div class="tw"><table><thead><tr><th>#</th><th>Jeu</th><th>Revenus</th><th>Unités</th><th>Note</th></tr></thead><tbody>';
  topRev.forEach(function(r,i) {
    h += '<tr><td>' + (i+1) + '</td><td><strong>' + r.name + '</strong></td><td class="ok">' + fmt(r.rev) + '</td><td>' + nb(r.u) + '</td><td>' + r.score + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  var topUnits = g.rel.slice().sort(function(a,b){ return b.u - a.u; }).slice(0, 5);
  h += '<div class="c"><h3>📦 Top 5 — Meilleures ventes</h3><div class="tw"><table><thead><tr><th>#</th><th>Jeu</th><th>Unités</th><th>Revenus</th><th>Note</th></tr></thead><tbody>';
  topUnits.forEach(function(r,i) {
    h += '<tr><td>' + (i+1) + '</td><td><strong>' + r.name + '</strong></td><td>' + nb(r.u) + '</td><td>' + fmt(r.rev) + '</td><td>' + r.score + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  var hits = g.rel.filter(function(r){ return r.isHit; });
  if (hits.length) {
    h += '<div class="c"><h3>🎯 Hits (note de 80 ou plus)</h3><div class="feat-grid">';
    hits.forEach(function(r) {
      h += '<div class="feat-check" style="cursor:default"><span><strong>' + r.name + '</strong><small>' + r.score + '/100 · ' + fmt(r.rev) + ' · ' + r.genre + '</small></span></div>';
    });
    h += '</div></div>';
  }

  h += '<div class="c"><h3>🏅 Trophées</h3>';
  ACHIEVEMENTS.forEach(function(a) {
    var unlocked = a.check();
    h += '<div class="trophy' + (unlocked ? '' : ' locked') + '" ' + tip(a.desc) + '>' +
      '<div class="trophy-icon">' + (unlocked ? a.icon : '🔒') + '</div>' +
      '<div style="flex:1"><div class="trophy-title">' + a.n + '</div><div class="trophy-desc">' + a.desc + '</div></div>' +
      (unlocked ? '<span class="ok" style="font-weight:600">Débloqué</span>' : '<span class="mu" style="font-size:12px">Verrouillé</span>') +
    '</div>';
  });
  h += '</div>';

  return h;
}

    {i:8, ic:'📈', l:'Graphiques', info:'Compare les ventes réelles, les résultats et les commandes physiques qui n’ont pas pu être livrées.'},
    {i:10, ic:'🏷️', l:'Licences', info:'Retrouve les univers du studio et les communautés qui attendent leurs prochains épisodes.'},
    {i:1, ic:'👥', l:'Équipe'},
    {i:2, ic:'📊', l:'Marché'},
    {i:3, ic:'🔬', l:'Recherche'},
    {i:4, ic:'⚙️', l:'Moteurs'},
    {i:5, ic:'💰', l:'Finances'},
    {i:6, ic:'🛠️', l:'Équipement'},
    {i:11, ic:'🖧', l:'Serveurs', info:'Loue des machines et vérifie si les joueurs trouvent une place pour se connecter.'},
  ];
  updateRegion($('#nv'), tabs.map(function(t) {
    return '<button data-tab="' + t.i + '" class="' + (tab===t.i?'on':'') + '" '+
       tip(t.info || ({
         1:'Recrute et répartis les employés qui développent les jeux du studio.',
         2:'Observe comment les genres et les technologies changent selon l’année.',
         3:'Débloque les techniques dont tes futurs jeux auront besoin.',
         4:'Choisis les outils qui serviront à construire et à faire tourner les jeux.',
         5:'Suis les entrées et les dépenses qui font vivre le studio.',
         6:'Aménage les locaux et trouve de nouveaux ateliers pour la distribution physique.'
       })[t.i])+'><span class="ic">' + t.ic + '</span><span>' + t.l + (g.windowed && windowPanels.get(t.i)?.element.hidden?' ▬':'') + '</span></button>';
  }).join('')+'<label class="window-mode" '+tip('Passe du tableau de bord à un bureau avec plusieurs fenêtres.',
    'Ouvre plusieurs onglets en même temps. Déplace-les par leur titre et redimensionne-les par leurs quatre bords ou leurs coins. Une fenêtre réduite se retrouve dans la barre latérale.')+
    '><input id="windowedMode" type="checkbox" aria-label="Mode fenêtres" '+(g.windowed?'checked':'')+' onchange="setWindowMode(this.checked)"><span>Mode fenêtres</span></label>');
  $('#windowedMode').checked = Boolean(g.windowed);
}

// Patch the DOM in place so daily updates preserve button identity and form inputs.
var regionMarkup = new WeakMap();
var renderTemplate = document.createElement('template');
function updateRegion(region, markup, view) {
  var previous = regionMarkup.get(region);
  if (previous && previous.markup === markup && previous.view === view) return false;
  renderTemplate.innerHTML = markup;
  if (previous && previous.view === view) patchChildren(region, renderTemplate.content);
  else region.replaceChildren(renderTemplate.content);
  regionMarkup.set(region, {markup: markup, view: view});
  return true;
}

function patchChildren(parent, nextParent) {
  var oldChildren = Array.from(parent.childNodes);
  var nextChildren = Array.from(nextParent.childNodes);
  nextChildren.forEach(function(next, index) {
    var current = oldChildren[index];
    if (!current) {
      parent.appendChild(next);
    } else if (current.nodeType !== next.nodeType || current.nodeName !== next.nodeName ||
        current.id !== next.id || (next.nodeName === 'INPUT' && current.getAttribute('value') !== next.getAttribute('value'))) {
      current.replaceWith(next);
    } else if (current.nodeType === Node.ELEMENT_NODE) {
      if (next.hasAttribute('data-form-output')) return;
      for (var attr of Array.from(current.attributes)) {
        if (attr.name==='hidden' && next.hasAttribute('data-form-visibility')) continue;
        if (!next.hasAttribute(attr.name)) current.removeAttribute(attr.name);
      }
      for (var attr of next.attributes) {
        if (attr.name==='hidden' && next.hasAttribute('data-form-visibility')) continue;
        if (current.getAttribute(attr.name) !== attr.value) current.setAttributeNS(attr.namespaceURI, attr.name, attr.value);
      }
      patchChildren(current, next);
    } else if (current.nodeValue !== next.nodeValue) {
      current.nodeValue = next.nodeValue;
    }
  });
  for (var leftover of oldChildren.slice(nextChildren.length)) leftover.remove();
}

function renderTab(id, target) {
  var view = id===0 ? 'project:'+projectFormKey() : id;
  var project = id===0;
  var previous = regionMarkup.get(target);
  if (target===$('#mn') && previous?.view!==view) captureProjectForm();
  var views = [pProj,pStaff,pMarket,pResearch,pEngines,pFin,pEquip,pRel,pGraph,pPalmares,pLicenses,pServers];
  var changed = updateRegion(target,views[id]?.() || '',view);
  if (target===$('#mn')) {
    var form = project && target.querySelector('#newProject');
    if (!form) renderedDraftKey = null;
    else if (changed) {
      var key = projectFormKey();
      if (renderedDraftKey!==key) restoreProjectForm(key);
      renderedDraftKey = key;
      updateMobileOpts();
      updateScWarn();
    }
  }
}

function focusWindow(panel) {
  if (tab===panel.id && panel.front===topWindow) return;
  tab = panel.id;
  panel.front = ++topWindow;
  panel.element.style.zIndex = panel.front;
  renderHeader();
  renderNav();
}

function windowGeometry(panel, next) {
  var area = $('#windowSpace');
  var availableWidth = Math.max(1,area.clientWidth);
  var availableHeight = Math.max(1,area.clientHeight);
  if (panel.maximized) next={x:0,y:0,width:availableWidth,height:availableHeight};
  var width = clamp(Math.min(270,availableWidth),availableWidth,next.width);
  var height = clamp(Math.min(190,availableHeight),availableHeight,next.height);
  var x = clamp(0,Math.max(0,availableWidth-width),next.x);
  var y = clamp(0,Math.max(0,availableHeight-height),next.y);
  panel.rect = {x:x,y:y,width:width,height:height};
  Object.assign(panel.element.style,{left:x+'px',top:y+'px',width:width+'px',height:height+'px'});
}

function bindWindowGesture(panel, handle, resizing) {
  function change(r,dx,dy) {
    if (panel.maximized) return;
    if (!resizing) return windowGeometry(panel,{...r,x:r.x+dx,y:r.y+dy});
    var area=$('#windowSpace'), left=r.x, right=r.x+r.width, top=r.y, bottom=r.y+r.height;
    var minW=Math.min(270,area.clientWidth), minH=Math.min(190,area.clientHeight);
    if (resizing.includes('w')) left=clamp(0,right-minW,left+dx);
    if (resizing.includes('e')) right=clamp(left+minW,area.clientWidth,right+dx);
    if (resizing.includes('n')) top=clamp(0,bottom-minH,top+dy);
    if (resizing.includes('s')) bottom=clamp(top+minH,area.clientHeight,bottom+dy);
    windowGeometry(panel,{x:left,y:top,width:right-left,height:bottom-top});
  }
  function persist() {
    g.windowLayout[panel.id] = panel.rect;
    save();
  }
  handle.addEventListener('pointerdown',function(event) {
    if (panel.maximized || event.button!==0 || (!resizing && event.target.closest('button'))) return;
    event.preventDefault();
    focusWindow(panel);
    handle.setPointerCapture(event.pointerId);
    var start = {x:event.clientX,y:event.clientY,rect:{...panel.rect}};
    function move(pointer) {
      var dx = pointer.clientX-start.x, dy = pointer.clientY-start.y;
    change(start.rect,dx,dy);
    }
    function end() {
      handle.removeEventListener('pointermove',move);
      persist();
    }
    handle.addEventListener('pointermove',move);
    handle.addEventListener('lostpointercapture',end,{once:true});
  });
  handle.addEventListener('keydown',function(event) {
    var movement = {ArrowLeft:[-20,0],ArrowRight:[20,0],ArrowUp:[0,-20],ArrowDown:[0,20]}[event.key];
    if (panel.maximized || !movement || event.target!==handle) return;
    event.preventDefault();
    var r = panel.rect;
    change(r,movement[0],movement[1]);
    persist();
  });
}

function openWindow(id) {
  if (!TAB_NAMES[id]) return null;
  if (windowPanels.has(id)) return windowPanels.get(id);
  var area = $('#windowSpace');
  var shell = document.createElement('section');
  shell.className = 'desktop-window';
  shell.setAttribute('aria-label','Fenêtre '+TAB_NAMES[id]);
  shell.dataset.window = id;
  shell.innerHTML = '<div class="window-title" tabindex="0" aria-label="Déplacer '+TAB_NAMES[id]+' avec les flèches">'+TAB_NAMES[id]+
    '<span class="window-actions"><button class="minimize" aria-label="Réduire la fenêtre" title="Réduire">−</button><button class="maximize" aria-label="Agrandir la fenêtre" title="Agrandir">□</button><button type="button" class="window-close" aria-label="Fermer '+TAB_NAMES[id]+'">×</button></span></div>'+
    '<button type="button" class="window-resize" aria-label="Redimensionner '+TAB_NAMES[id]+' avec les flèches">◢</button>';
  var pane = id===0 ? $('#mn') : Object.assign(document.createElement('div'),{className:'window-content'});
  pane.hidden = false;
  shell.insertBefore(pane,shell.lastElementChild);
  area.appendChild(shell);
  var panel = {id:id,element:shell,content:pane,front:++topWindow};
  windowPanels.set(id,panel);
  shell.style.zIndex = panel.front;
  var offset = (windowPanels.size-1)%7*26;
  windowGeometry(panel,g.windowLayout[id] || {x:18+offset,y:16+offset,width:Math.min(700,area.clientWidth-8),height:Math.min(540,area.clientHeight-8)});
  shell.querySelector('.window-close').addEventListener('click',()=>closeWindow(id));
  shell.addEventListener('pointerdown',()=>focusWindow(panel));
  shell.addEventListener('focusin',()=>focusWindow(panel));
  bindWindowGesture(panel,shell.querySelector('.window-title'),false);
  var maxButton=shell.querySelector('.maximize');
  maxButton.onclick=()=>{
    if (!panel.maximized) panel.restoreRect={...panel.rect};
    panel.maximized=!panel.maximized;
    shell.classList.toggle('maximized',panel.maximized);
    maxButton.textContent=panel.maximized?'❐':'□';
    maxButton.title=panel.maximized?'Rétablir':'Agrandir';
    maxButton.setAttribute('aria-label',maxButton.title+' la fenêtre');
    windowGeometry(panel,panel.restoreRect);
  };
  shell.querySelector('.minimize').onclick=()=>{
    captureProjectForm();
    shell.hidden=true;
    tab=Array.from(windowPanels.values()).filter(p=>!p.element.hidden).sort((a,b)=>b.front-a.front)[0]?.id ?? -1;
    render();
  };
  for (var dir of ['n','s','e','w','nw','ne','sw','se']) {
    var edge=dir==='se'?shell.querySelector('.window-resize'):document.createElement('span');
    edge.classList.add('resize-edge');
    if (dir.length===2) edge.classList.add('corner');
    edge.dataset.dir=dir;
    shell.appendChild(edge);
    bindWindowGesture(panel,edge,dir);
  }
  return panel;
}

function closeWindow(id) {
  var panel = windowPanels.get(id);
  if (!panel) return;
  if (id===0) {
    captureProjectForm();
    $('#windowSpace').before(panel.content);
    panel.content.hidden = true;
  }
  panel.element.remove();
  windowPanels.delete(id);
  if (tab===id) tab = Array.from(windowPanels.values()).filter(p=>!p.element.hidden).sort((a,b)=>b.front-a.front)[0]?.id ?? -1;
  save();
  render();
}

function setWindowMode(enabled) {
  captureProjectForm();
  var area = $('#windowSpace'), main = $('#mn');
  g.windowed = enabled;
  if (enabled) {
    if (tab!==0) updateRegion(main,'','workspace-empty');
    main.hidden = true;
    area.hidden = false;
    openWindow(tab);
  } else {
    area.before(main);
    for (var panel of windowPanels.values()) panel.element.remove();
    windowPanels.clear();
    area.hidden = true;
    main.hidden = false;
    if (tab<0) tab = 0;
  }
  render();
  save();
}

function selectTab(id) {
  captureProjectForm();
  tab = id;
  if (g.windowed) { var panel=openWindow(id); panel.element.hidden=false; focusWindow(panel); }
  render();
  save();
}

function render() {
  try {
    renderHeader();
    renderNav();
    renderMarketRail();
    if (g.windowed) {
      var area = $('#windowSpace');
      if (area.hidden) area.hidden = false;
      if (tab>=0 && !windowPanels.has(tab)) openWindow(tab);
      if (!windowPanels.has(0)) $('#mn').hidden = true;
      for (var panel of windowPanels.values()) renderTab(panel.id,panel.content);
    } else renderTab(tab,$('#mn'));
    showReleaseDecision();
  } catch (e) {
    console.error('Render error:',e);
    var main = $('#mn');
    if (main) regionMarkup.delete(main);
    if (main) main.innerHTML = '<div class="c"><h3 class="ko">Erreur d’affichage</h3><p>'+escapeAttribute(e.message || e)+'</p></div>';
  }
}

// === SAVE/LOAD ===
function save() {
  captureProjectForm();
  try {
    var data = JSON.parse(JSON.stringify(g));
    delete data.cand;
    localStorage.setItem('stycoon_save', JSON.stringify(data));
  } catch(e) {}
}
function load() {
  try {
    var raw = localStorage.getItem('stycoon_save');
    if (!raw) return null;
    var data = JSON.parse(raw);
    if (!data.staff) return null;
    data.factories = Array.isArray(data.factories) ? data.factories : [];
    data.stockEngines = Array.isArray(data.stockEngines) ? data.stockEngines : [];
    data.techs = Array.isArray(data.techs) ? data.techs : [];
    data.revenueHistory = Array.isArray(data.revenueHistory) ? data.revenueHistory : [];
    data.dailyFinStart = data.dailyFinStart ?? data.day;
    data.dailyFin = data.dailyFin || {};
    data.fin = Array.isArray(data.fin) ? data.fin : [];
    data.log = Array.isArray(data.log) ? data.log : [];
    data.rel = Array.isArray(data.rel) ? data.rel : [];
    data.eq = data.eq && typeof data.eq === 'object' ? data.eq : {desk:0, pc:0, rest:0, srv:0};
    data.teams = Array.isArray(data.teams) && data.teams.length ? data.teams : [{id: 1, name: 'Équipe Alpha', proj: null, crunch: false}];
    if (data.currentTeam === undefined) data.currentTeam = 0;
    if (data.currentTeam >= data.teams.length) data.currentTeam = 0;
    data.m = data.m && typeof data.m === 'object' ? data.m : {rev:0, cost:0};
    if (data.loan && data.loan.pay <= 0) data.loan.pay = loanPayment(data.loan.left);
    data.yr = data.yr && typeof data.yr === 'object' ? data.yr : {rev:0, cost:0};
    delete data.gd;
    delete data.genreBoosts;
    delete data.cm;
    data.engines = Array.isArray(data.engines) && data.engines.length ? data.engines : [{id:'basic', name:'Moteur maison', techs:[], created:0, price:0, royalty:0, users:0, totalUsers:0, revenue:0}];
    data.nextTeamId = data.nextTeamId || (data.teams.length + 1);
    data.graphGame = data.graphGame || 0;
    data.servers = Array.isArray(data.servers) ? data.servers.filter(contract=>SERVER_TYPES[contract?.type]) : [];
    data.stockWeeks ||= {};
    data.projectForms ||= {};
    data.windowLayout ||= {};
    data.windowed = Boolean(data.windowed);
    if (data.over && data.neg < BANKRUPTCY_DAYS) data.over = false;
    var legacyLicenses = !Array.isArray(data.licenses);
    data.licenses = legacyLicenses ? [] : data.licenses;
    data.nextLicenseId ||= 1;
    data.teams.forEach(function(t) {
      if (t.proj) {
        if (!Array.isArray(t.proj.platforms)) t.proj.platforms = [t.proj.plat || 'PC'];
        if (!Array.isArray(t.proj.translations)) t.proj.translations = [];
        if (t.proj.translationRatio === undefined) t.proj.translationRatio = 1;
        if (t.proj.startDay === undefined) t.proj.startDay = data.day || 0;
        if (!Array.isArray(t.proj.features)) t.proj.features = [];
        if (!t.proj.done) t.proj.done = {prog:0, design:0, art:0, qa:0};

        if (!t.proj.craft) {
          t.proj.craft = Object.fromEntries(CORE_ROLES.map(function(role) {
            var staff = data.staff.filter(member => member.teamId===t.id && member.role===role);
            var skill = staff.length ? staff.reduce((total,member) => total+member.skill,0)/staff.length : SC[t.proj.sc].skill*.45;
            return [role,skill*Math.min(t.proj.need[role],t.proj.done[role])];
          }));
        }
        t.proj.spent = t.proj.spent || 0;
        t.proj.priority = t.proj.priority || 'balanced';
        t.proj.polish = t.proj.polish || 0;
        if (t.proj.dlcBaseId !== undefined) t.proj.dlcProfile ||= 'standard';
        if (t.proj.polishing && !t.proj.launchDecision) t.proj.launchDecision = 'polish';
      }
    });
    data.rel.forEach(function(r,index) {
      r.id ||= 'legacy-' + index + '-' + r.day;
      r.franchiseId ||= r.id;
      r.installment ||= 1;
      r.addons ||= [];
      if (!Array.isArray(r.platforms)) r.platforms = [r.plat || 'PC'];
      if (!Array.isArray(r.translations)) r.translations = [];
      if (r.lost === undefined) r.lost = 0;
      if (r.f2p && !r.freePlatforms && r.prices) r.freePlatforms = Object.keys(r.prices).filter(platform=>r.prices[platform]===0);
      if (r.markets) for (var market of r.markets) {
        if (market.platform==='Console' && (r.prices?.Console ?? r.price)>0) {
          market.physical = true;
          market.dynamicPrice = true;
        }
      }
      r.cost = r.cost || 0;
      r.rev = r.rev || 0;
      if (!r.financeWeeks) migrateGameFinance(r,data.day);
    });
    if (legacyLicenses) {
      for (var released of data.rel.slice().reverse()) {
        var license = data.licenses.find(item=>item.id===released.franchiseId);
        if (!license) {
          license = {id:released.franchiseId,name:released.name,fans:0,created:released.day};
          data.licenses.push(license);
        }
        license.fans += (released.u || 0)*clamp(0,.32,(released.score-46)*.008);
      }
      for (var team of data.teams) {
        var project = team.proj;
        if (!project || project.dlcBaseId!==undefined) continue;
        if (!project.franchiseId) project.franchiseId = 'lic-'+data.nextLicenseId++;
        if (!data.licenses.some(license=>license.id===project.franchiseId))
          data.licenses.push({id:project.franchiseId,name:project.name,fans:0,created:project.startDay});
        project.installment ||= 1;
        if (project.f2p) project.freePlatforms = ['Mobile'];
        if (project.mt) {
          project.monetization = 'cosmetics';
          project.storePressure = 1;
        }
      }
    }
    NID = data.staff.reduce((next, s) => Math.max(next, s.id + 1), 1);
    return data;
  } catch(e) {
    return null;
  }
}
function reset() {
  ask('Recommencer une nouvelle partie ? La sauvegarde sera effacée.', function() {
    if (g.windowed) setWindowMode(false);
    localStorage.removeItem('stycoon_save');
    newGame();
    renderedDraftKey = null;
    projectDraft = null;
    regionMarkup.delete($('#mn'));
    setSpeed(0);
  });
}

// === INIT ===

function installTooltips() {
  var bubble = $('#hoverTip');
  var hovered = null, focused = null;
  var lastKey;
  function target(element) {
    if (!element || element.closest?.('input, select, textarea, [contenteditable="true"]')) return null;
    return element.closest?.('[data-tip]') || null;
  }
  function draw(anchor, point = null) {
    var text = anchor?.getAttribute('data-tip');
    if (!text || !anchor.isConnected) return hide();
    var context = anchor.closest('#newProject') ? 'Le studio prépare sa prochaine sortie.'
      : anchor.closest('#marketRail,.daily-fin') ? 'Les registres du studio gardent la trace de ses résultats.'
      : 'Le studio suit de près les décisions et les résultats.';
    var rp = anchor.getAttribute('data-tip-rp') || context;
    var effectAttribute = anchor.getAttribute('data-tip-effects');
    var key = JSON.stringify([rp,text,effectAttribute]);
    if (key!==lastKey) {
      var sections = [Object.assign(document.createElement('div'),{className:'tooltip-rp',textContent:rp}),
        Object.assign(document.createElement('div'),{className:'tooltip-rule',textContent:text})];
      var effects = effectAttribute ? JSON.parse(effectAttribute) : [];
      if (effects.length) {
        var effectList = Object.assign(document.createElement('ul'),{className:'tooltip-effects'});
        for (var [color,value] of effects) {
          effectList.appendChild(Object.assign(document.createElement('li'),{className:color,textContent:value}));
        }
        sections.push(effectList);
      }
      bubble.replaceChildren(...sections);
      lastKey = key;
    }
    bubble.hidden = false;
    var box = anchor.getBoundingClientRect();
    var width = bubble.offsetWidth, height = bubble.offsetHeight;
    var x = point ? point.x : box.left+box.width/2;
    var y = point ? point.y : box.top;
    var top = y-height-12>=8 ? y-height-12 : (point ? y : box.bottom)+12;
    bubble.style.left = clamp(8,window.innerWidth-width-8,x-width/2)+'px';
    bubble.style.top = clamp(8,window.innerHeight-height-8,top)+'px';
  }
  function hide() { bubble.hidden = true; }
  document.addEventListener('pointermove',function(event) {
    if (event.pointerType==='touch') return;
    hovered = target(document.elementFromPoint(event.clientX,event.clientY));
    if (hovered) draw(hovered,{x:event.clientX,y:event.clientY});
    else if (focused) draw(focused);
    else hide();
  },true);
  document.addEventListener('focusin',function(event) {
    focused = event.target.matches(':focus-visible') ? target(event.target) : null;
    if (focused) draw(focused);
  });
  document.addEventListener('focusout',function() { focused = null; hide(); });
  document.addEventListener('pointerdown',hide,true);
  document.addEventListener('pointerleave',function() { hovered = null; hide(); });
  document.addEventListener('scroll',hide,true);
  window.addEventListener('resize',hide);
  document.addEventListener('keydown',event=>{ if (event.key==='Escape') hide(); });
}

function init() {
  var saved = load();
  if (saved) {
    g = saved;
    g.cand = cands();
  } else newGame();
  projectDraft = curTeam().draftContext || null;
  installTooltips();
  new ResizeObserver(function(entries) {
    document.documentElement.style.setProperty('--header-height',entries[0].target.offsetHeight+'px');
    for (var panel of windowPanels.values()) windowGeometry(panel,panel.rect);
  }).observe($('#hd'),{box:'border-box'});
  document.addEventListener('click', function(event) {
    var button = event.target.closest('#nv button[data-tab], #hd button[data-tab]');
    if (!button) return;
    sfxTab();
    selectTab(+button.dataset.tab);
  });
  document.addEventListener('keydown',function(event) {
    if (event.code!=='Space' || event.repeat || event.ctrlKey || event.altKey || event.metaKey ||
        event.target.closest?.('input, textarea, select, [contenteditable], button:focus-visible, summary:focus-visible, a:focus-visible') || $('#md')) return;
    event.preventDefault();
    toggleClock(true);
  });
  window.addEventListener('resize',()=>{
    for (var panel of windowPanels.values()) windowGeometry(panel,panel.rect);
  });
  document.addEventListener('pointerdown', function(event) {
    if (event.isPrimary && event.button === 0 &&
        !event.target.closest('select') &&
        event.target.closest('#hd button, #nv button, #mn button, #mn label, #mn [onclick], #marketRail button, #windowSpace button, #windowSpace [onclick]')) {
      pressedPointer = event.pointerId;
    }
  });
  function releasePointer(event) {
    if (event.pointerId === pressedPointer) pressedPointer = null;
  }
  window.addEventListener('pointerup', releasePointer, true);
  window.addEventListener('pointercancel', releasePointer, true);
  window.addEventListener('blur', function() { pressedPointer = null; });
  window.addEventListener('pagehide', save);
  setSpeed(g.speed);
}

window.addEventListener('DOMContentLoaded', init);
